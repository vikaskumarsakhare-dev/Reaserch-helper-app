<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>रिसर्च संग्रह</title>
<style>
:root{--bg:#0e1a2b;--card:#162338;--card2:#1e2f49;--line:#2a3d5c;--tx:#e6eef7;--mut:#8aa0bd;--ac:#2dd4bf;--acd:#042a26;--danger:#ff8b84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:20px;margin:0;font-weight:700;flex:1}
.bar svg{flex:none;border-radius:8px}
.ver{font-size:12px;color:var(--mut)}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;line-height:1;flex:none}
.title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=search],input[type=text]{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
.sr{padding:10px 14px;flex:none}
.sr input{background:var(--card)}

/* Home */
#hbody{flex:1;overflow:auto;padding:0 14px 110px}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#list li{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
#list li:active{background:var(--card2)}
.ic{font-size:26px;width:40px;text-align:center;flex:none}
.mt{flex:1;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13px;color:var(--mut)}
.more{border:0;background:none;color:var(--mut);font-size:22px;line-height:1;padding:10px 14px;flex:none}
#empty{text-align:center;color:var(--mut);padding:60px 20px}
#empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
#fab{position:fixed;z-index:16;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;border:0;background:var(--ac);color:var(--acd);font-size:36px;line-height:1;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
#fab.open{transform:rotate(45deg)}
#scrim{position:fixed;inset:0;z-index:14;background:transparent}
#fabmenu{position:fixed;z-index:15;right:20px;bottom:calc(22px + 62px + 24px + env(safe-area-inset-bottom,0px));min-width:190px;background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.5);overflow:hidden;transform-origin:bottom right;animation:pop .12s ease-out}
#fabmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px;text-align:left}
#fabmenu button:last-child{border-bottom:0}
#fabmenu button:active{background:var(--card)}
#fabmenu b{color:var(--ac);width:1.2em;text-align:center;font-weight:600}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* Viewer: top row (back + tabs) and sheet title never move; only the table scrolls */
#tabs{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto}
.tab{flex:none;padding:8px 14px;border-radius:10px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
#strip{flex:none;padding:4px 12px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
#main{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#content{--z:1;min-height:100px}
.fname{padding:6px 12px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--mut);padding:18px 14px}

table{border-collapse:separate;border-spacing:0;font-size:calc(13px*var(--z));line-height:1.35}
th,td{min-width:8.5em;max-width:22em;padding:.4em .6em;vertical-align:top;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
th{background:var(--card2);color:var(--ac);font-weight:600;font-size:.92em}
tr.hrow th{position:sticky;top:0;z-index:2}
tr:nth-child(even) td{background:#112036}
td.ed{padding:0}
td.ed,tr:nth-child(even) td.ed{background:rgba(45,212,191,.08)}
td.ed:focus-within{outline:2px solid var(--ac);outline-offset:-2px;background:rgba(45,212,191,.16)}
.v{padding:.4em .6em;min-height:2.3em;outline:none;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:.3em;padding:0 .5em .45em}
.chips:empty{display:none}
.chips a{font-size:.86em;padding:.12em .55em;border:1px solid var(--ac);border-radius:.6em;text-decoration:none;white-space:nowrap}
th.ed{outline:none}
th.ed:focus{outline:2px solid var(--ac);outline-offset:-2px;background:#263a5a}
th.ed:empty::before{content:attr(data-ph);opacity:.55}
th.plus,td.plus{min-width:0;width:3em;max-width:none;text-align:center;padding:.3em;background:var(--bg)}
.addc{width:2em;height:2em;border-radius:.6em;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:1em;line-height:1}
.addr{padding:12px 12px 90px}
.addr-btn{padding:10px 16px;border-radius:10px;border:1px dashed var(--ac);background:transparent;color:var(--ac);font-size:14px}
table.grid th:first-child,table.grid td:first-child{min-width:3.2em;max-width:5em}
.gh{padding:12px 14px 10px;text-align:center}
.gh input{display:block;width:100%;text-align:center;background:transparent;border:0;border-radius:0;padding:4px 0;color:var(--tx)}
.gh input:focus{outline:none;border-bottom:1px solid var(--ac)}
#gTitle{font-size:calc(21px*var(--z));font-weight:700}
#gSub{font-size:calc(14px*var(--z));color:var(--mut)}

pre.txt{white-space:pre-wrap;word-break:break-word;padding:14px;margin:0;font:calc(13px*var(--z))/1.7 ui-monospace,Menlo,monospace}
.imgw{padding:10px}.imgw img{width:calc(100%*var(--z));max-width:none;height:auto;border-radius:6px;display:block}
.doc{background:#fff;color:#161616;padding:14px;margin:10px 12px;border-radius:10px;line-height:1.6;word-break:break-word;font-size:calc(15px*var(--z))}
.doc a{color:#0b57d0}.doc img{max-width:100%;height:auto}
.doc table{border-collapse:collapse;font-size:inherit}.doc td,.doc th{border:1px solid #ccc;background:#fff;color:#161616;padding:5px 8px;min-width:0;position:static}
.pdfwrap{padding:6px 0;width:100%}
.pg{position:relative;margin:0 auto 8px;background:#fff}
.pdflink{position:absolute;display:block}
.page{padding:12px 14px 140px}
.page #pgTitle{font-size:calc(20px*var(--z));font-weight:700;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;margin-bottom:12px}
.page #pgTitle:focus,.page #pgText:focus{outline:none;border-color:var(--ac)}
.page #pgText{display:block;width:100%;border:0;background:transparent;color:var(--tx);font:inherit;font-size:calc(16px*var(--z));line-height:1.65;resize:none;padding:0;overflow:hidden}

/* Dialogs */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,8,16,.62)}
#mbody{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#mbody h2{font-size:16px;margin:0 0 6px;word-break:break-word}
.msg{color:var(--mut);font-size:14px;margin-top:8px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;padding:14px 6px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px}
.opt:last-child{border-bottom:0}
.opt.danger{color:var(--danger)}
.mrow{display:flex;gap:10px;margin-top:14px}
.mbtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.mbtn.pri{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.mbtn.dng{background:#d9453d;border-color:#d9453d;color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:88%}
</style>
</head>
<body>

<div id="home" class="screen">
  <div class="bar">
    <svg width="34" height="34" viewBox="0 0 432 432" aria-hidden="true"><rect width="432" height="432" rx="95" fill="#0e1a2b"/><g transform="translate(216 216) scale(1.15) translate(-216 -216)"><rect x="150" y="120" width="112" height="180" rx="14" fill="#e8f1f5"/><rect x="166" y="142" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="166" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="190" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="214" width="46" height="9" rx="4.5" fill="#5a6e87"/><circle cx="244" cy="256" r="34" fill="#0e1a2b" stroke="#2dd4bf" stroke-width="16"/><line x1="274" y1="286" x2="298" y2="310" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round"/></g></svg>
    <h1>रिसर्च संग्रह</h1>
    <span class="ver" id="ver"></span>
  </div>
  <div class="sr"><input id="hsearch" type="search" placeholder="Search files"></div>
  <div id="hbody">
    <ul id="list"></ul>
    <div id="empty" class="hidden"><b>No files yet</b>Tap + to add a file or create a new table.</div>
  </div>
</div>
<div id="scrim" class="hidden"></div>
<div id="fabmenu" class="hidden">
  <button data-m="upload"><b>↑</b>Upload file</button>
  <button data-m="create"><b>+</b>Create new</button>
</div>
<button id="fab" aria-label="Add">+</button>

<div id="viewer" class="screen hidden">
  <div id="top" class="bar">
    <button id="back" class="ibtn" aria-label="Back">←</button>
    <div id="tabs" class="hidden"></div>
    <div id="vtitle" class="title"></div>
  </div>
  <div id="strip" class="hidden"></div>
  <div id="main"><div id="content"></div></div>
</div>

<div id="modal" class="hidden"><div id="mbody"></div></div>
<input type="file" id="picker" multiple hidden>
<div id="toast" class="hidden"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/mammoth.browser.min.js"></script>
<script>
(function(){
'use strict';
var VERSION='v1.4';
var $=function(s){return document.querySelector(s)};
var content=$('#content'),main=$('#main');
$('#ver').textContent=VERSION;

/* ---------- helpers ---------- */
var ICON={sheet:'📊',pdf:'📕',docx:'📄',img:'🖼️',text:'📝',page:'🗒️',grid:'📋',other:'📁'};
var KIND={xlsx:'sheet',xls:'sheet',xlsm:'sheet',xlsb:'sheet',ods:'sheet',csv:'sheet',tsv:'sheet',pdf:'pdf',docx:'docx',
  png:'img',jpg:'img',jpeg:'img',gif:'img',webp:'img',bmp:'img',svg:'img',
  txt:'text',md:'text',json:'text',html:'text',htm:'text',xml:'text',log:'text',rtf:'text'};
var MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml'};
var DEF_HEAD=['Sr. No.','Statement','Source','Link to Source'];
function ext(n){var p=n.split('.');return p.length>1?p.pop().toLowerCase():''}
/* the file type is stored separately, so renaming never changes how a file opens */
function fix(m){if(m.ext===undefined)m.ext=ext(m.name);if(!m.edits)m.edits={};return m}
function kindM(m){return m.kind||KIND[m.ext]||'other'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var URLRE=/https?:\/\/[^\s<>"\u0900-\u097F]+/g;
function linkify(t){
  return esc(t).replace(URLRE,function(u){
    var m=u.match(/[.,;:!?)\]]+$/),tail=m?m[0]:'',url=tail?u.slice(0,-tail.length):u;
    return '<a href="'+url+'">'+url+'</a>'+tail;
  });
}
/* small tappable chips under a cell for every link written in it */
function chipsHtml(t){
  var seen={},out=[],m=String(t).match(URLRE)||[];
  m.forEach(function(u){
    u=u.replace(/[.,;:!?)\]]+$/,'');
    if(seen[u]||out.length>=4)return;seen[u]=1;
    var host=u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0];
    out.push('<a href="'+esc(u)+'">↗ '+esc(host)+'</a>');
  });
  return out.join('');
}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB'}
function fmtDate(t){try{return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.add('hidden')},2600)}
function tick(){return new Promise(function(r){setTimeout(r,30)})}
function hasEdits(m){
  var e=m.edits;if(!e)return false;
  return Object.keys(e).some(function(k){var s=e[k];return s&&(s.addRows||s.addCols||Object.keys(s.cells||{}).length)});
}
function newId(){var n=Date.now();return n.toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- storage (stays on the phone) ---------- */
var dbp=new Promise(function(res,rej){
  var r=indexedDB.open('shodh-sangrah',1);
  r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('data',{keyPath:'id'})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
});
function run(names,mode,fn){
  return dbp.then(function(db){return new Promise(function(res,rej){
    var t=db.transaction(names,mode),out;
    try{out=fn(t)}catch(e){rej(e);return}
    t.oncomplete=function(){res(out&&out.result)};
    t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
  })});
}
function allMeta(){return run(['meta'],'readonly',function(t){return t.objectStore('meta').getAll()})}
function getMeta(id){return run(['meta'],'readonly',function(t){return t.objectStore('meta').get(id)})}
function getData(id){return run(['data'],'readonly',function(t){return t.objectStore('data').get(id)})}
function putMeta(m){return run(['meta'],'readwrite',function(t){return t.objectStore('meta').put(m)})}
function addFile(m,buf){return run(['meta','data'],'readwrite',function(t){t.objectStore('meta').put(m);return t.objectStore('data').put({id:m.id,buf:buf})})}
function delFile(id){return run(['meta','data'],'readwrite',function(t){t.objectStore('meta').delete(id);return t.objectStore('data').delete(id)})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist()}

/* ---------- open links in Chrome ---------- */
function openExternal(u){
  try{var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.Browser){C.Plugins.Browser.open({url:u});return}}catch(e){}
  window.open(u,'_blank');
}
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
  e.preventDefault();
  var h=a.getAttribute('href')||'';
  if(/^(https?:|mailto:|tel:)/i.test(h))openExternal(h);
});

/* ---------- home ---------- */
function subLine(m){
  var k=kindM(m),d=fmtDate(m.opened);
  if(k==='page')return d+' · Page';
  if(k==='grid'){var n=(m.grid&&m.grid.rows&&m.grid.rows.length)||0;return d+' · Table · '+n+(n===1?' row':' rows')}
  return d+' · '+fmtSize(m.size)+(hasEdits(m)?' · Edited':'');
}
async function renderList(){
  var all=(await allMeta())||[];
  var q=$('#hsearch').value.trim().toLowerCase();
  var items=all.map(fix).filter(function(m){return !q||m.name.toLowerCase().indexOf(q)>-1||(m.text&&m.text.toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.opened-a.opened});
  $('#empty').classList.toggle('hidden',all.length>0);
  $('#list').innerHTML=items.map(function(m){
    return '<li data-id="'+m.id+'"><div class="ic">'+ICON[kindM(m)]+'</div><div class="mt"><div class="nm">'+esc(m.name)+'</div><div class="sb">'+subLine(m)+'</div></div><button class="more" data-more="'+m.id+'" aria-label="Options">⋮</button></li>';
  }).join('');
}
$('#list').addEventListener('click',function(e){
  var mo=e.target.closest('[data-more]');
  if(mo){e.stopPropagation();openMenu(mo.getAttribute('data-more'));return}
  var li=e.target.closest('li');if(li)openFile(li.getAttribute('data-id'));
});
$('#hsearch').addEventListener('input',renderList);

/* + button: a small popup right above it */
var fabOpen=false;
function setFab(open){
  fabOpen=open;
  $('#fabmenu').classList.toggle('hidden',!open);
  $('#scrim').classList.toggle('hidden',!open);
  $('#fab').classList.toggle('open',open);
}
$('#fab').addEventListener('click',function(){
  if($('#home').classList.contains('hidden'))return;
  setFab(!fabOpen);
});
$('#scrim').addEventListener('click',function(){setFab(false)});
$('#fabmenu').addEventListener('click',function(e){
  var b=e.target.closest('[data-m]');if(!b)return;
  var a=b.getAttribute('data-m');
  setFab(false);
  if(a==='upload')$('#picker').click();
  else createGrid();
});
$('#picker').addEventListener('change',function(){
  var fs=Array.prototype.slice.call($('#picker').files);
  if(!fs.length)return;
  addFiles(fs).then(function(){$('#picker').value=''},function(){$('#picker').value=''});
});
async function addFiles(fs){
  var lastId=null;
  for(var i=0;i<fs.length;i++){
    var f=fs[i];
    try{
      var buf=await f.arrayBuffer(),now=Date.now(),nm=f.name||'File';
      var m={id:newId(),name:nm,ext:ext(nm),size:buf.byteLength,added:now,opened:now,edits:{}};
      await addFile(m,buf);lastId=m.id;
    }catch(e){toast('Could not add: '+(f.name||'file'))}
  }
  await renderList();
  if(fs.length===1&&lastId)openFile(lastId);
  else if(lastId)toast('Files added');
}
/* a new Excel-like table: Sr. No. / Statement / Source / Link to Source */
async function createGrid(){
  var now=Date.now(),rows=[];
  for(var i=1;i<=5;i++)rows.push([String(i),'','','']);
  var m={id:newId(),name:'Untitled table',ext:'',kind:'grid',text:'',size:0,added:now,opened:now,edits:{},
         grid:{sub:'',head:DEF_HEAD.slice(),rows:rows}};
  await addFile(m,new ArrayBuffer(0));
  await renderList();
  openFile(m.id);
}

/* ---------- rename / delete ---------- */
var modalOpen=false,pend=null;
function openModal(html){$('#mbody').innerHTML=html;$('#modal').classList.remove('hidden');modalOpen=true}
function closeModal(){$('#modal').classList.add('hidden');$('#mbody').innerHTML='';modalOpen=false;pend=null}
function baseName(m){var s='.'+m.ext;return(m.ext&&m.name.toLowerCase().slice(-s.length)===s)?m.name.slice(0,-s.length):m.name}
async function openMenu(id){
  var m=await getMeta(id);if(!m)return;
  pend={id:id};
  openModal('<h2>'+esc(m.name)+'</h2><button class="opt" data-a="rename">Rename</button><button class="opt danger" data-a="delete">Delete</button><button class="opt" data-a="cancel">Cancel</button>');
}
async function renameFile(m,val){
  val=val.replace(/[\\\/:*?"<>|]/g,'-').trim();
  var s='.'+m.ext;
  if(m.ext&&val.toLowerCase().slice(-s.length)===s)val=val.slice(0,-s.length).trim();
  if(!val){toast('Name cannot be empty');return false}
  m.name=val+(m.ext?s:'');
  await putMeta(m);return true;
}
$('#modal').addEventListener('click',async function(e){
  if(e.target.id==='modal'){closeModal();return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),id=pend&&pend.id;
  if(a==='cancel'){closeModal();return}
  var m=id?await getMeta(id):null;
  if(!m){closeModal();return}
  fix(m);
  if(a==='rename'){
    openModal('<h2>Rename file</h2><input id="rn" type="text" maxlength="120" value="'+esc(baseName(m))+'"><div class="msg">'+(m.ext?'The file type (.'+esc(m.ext)+') stays the same.':'Type a new name.')+'</div><div class="mrow"><button class="mbtn" data-a="cancel">Cancel</button><button class="mbtn pri" data-a="save">Save</button></div>');
    setTimeout(function(){var i=$('#rn');if(i){i.focus();i.select()}},60);
  }else if(a==='save'){
    if(await renameFile(m,$('#rn').value)){closeModal();renderList();toast('Renamed')}
  }else if(a==='delete'){
    openModal('<h2>Delete this file?</h2><div class="msg">'+esc(m.name)+' and your edits in it will be deleted. This cannot be undone.</div><div class="mrow"><button class="mbtn" data-a="cancel">Cancel</button><button class="mbtn dng" data-a="confirmdel">Delete</button></div>');
  }else if(a==='confirmdel'){
    await delFile(id);closeModal();renderList();toast('Deleted');
  }
});
$('#modal').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='rn'){var s=$('[data-a="save"]');if(s)s.click()}
});

/* ---------- screens and the back button ---------- */
var cur=null,curSheet=0,blobUrls=[],saveT=null,zoom=1;
function showHome(){$('#viewer').classList.add('hidden');$('#home').classList.remove('hidden');$('#fab').classList.remove('hidden')}
async function flushSave(){
  clearTimeout(saveT);saveT=null;
  if(cur){try{await putMeta(cur)}catch(e){toast('Could not save changes')}}
}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(flushSave,400)}
function gridText(g){return [g.sub].concat(g.head,[].concat.apply([],g.rows)).join(' ')}
function gridEmpty(m){
  var g=m.grid;if(!g)return false;
  return !g.sub.trim()&&g.head.join('|')===DEF_HEAD.join('|')&&g.rows.every(function(r){return r.slice(1).every(function(c){return !c.trim()})});
}
async function goHome(){
  await flushSave();
  if(cur){
    var k=kindM(cur);
    if(k==='page'&&!(cur.text||'').trim()&&cur.name==='Untitled page'){try{await delFile(cur.id)}catch(e){}}
    if(k==='grid'&&cur.name==='Untitled table'&&gridEmpty(cur)){try{await delFile(cur.id)}catch(e){}}
  }
  cur=null;pdfTok++;
  if(pdfObs){pdfObs.disconnect();pdfObs=null}
  if(pdfDoc){try{pdfDoc.destroy()}catch(e){}pdfDoc=null}
  blobUrls.forEach(function(u){URL.revokeObjectURL(u)});blobUrls=[];
  content.innerHTML='';wb=null;
  showHome();renderList();
}
var AppP=null,nativeBack=false;
try{AppP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App}catch(e){}
/* one step back each time: popup -> dialog -> file -> home (search cleared) -> leave app */
function handleBack(){
  if(fabOpen){setFab(false);return}
  if(modalOpen){closeModal();return}
  if(!$('#viewer').classList.contains('hidden')){goHome();return}
  if($('#hsearch').value){$('#hsearch').value='';renderList();return}
  if(AppP&&AppP.exitApp)AppP.exitApp();
}
if(AppP&&AppP.addListener){nativeBack=true;AppP.addListener('backButton',handleBack)}
else{window.addEventListener('popstate',function(){
  if(fabOpen){setFab(false);return}
  if(modalOpen){closeModal();return}
  if(!$('#viewer').classList.contains('hidden'))goHome();
})}
$('#back').addEventListener('click',function(){if(nativeBack)goHome();else history.back()});

async function openFile(id){
  var m=await getMeta(id),d=await getData(id);
  if(!m||!d){toast('File not found');return}
  fix(m);m.opened=Date.now();await putMeta(m);
  cur=m;zoom=1;content.style.setProperty('--z','1');
  setFab(false);$('#fab').classList.add('hidden');
  $('#home').classList.add('hidden');$('#viewer').classList.remove('hidden');
  if(!nativeBack)history.pushState({v:1},'');
  $('#vtitle').textContent=m.name;$('#vtitle').classList.remove('hidden');
  $('#tabs').classList.add('hidden');$('#tabs').innerHTML='';$('#strip').classList.add('hidden');
  main.scrollTop=0;main.scrollLeft=0;
  content.innerHTML='<p class="muted">Opening…</p>';
  await tick();
  var fn={sheet:showSheet,pdf:showPdf,docx:showDocx,img:showImg,text:showText,page:showPage,grid:showGrid,other:showOther}[kindM(m)];
  try{await fn(d.buf,m)}
  catch(e){content.innerHTML='<p class="muted">This file could not be opened. It may be damaged or in an unusual format.<br><br>'+esc(e&&e.message||e)+'</p>'}
}

/* ---------- editable cells (shared by uploaded sheets and new tables) ---------- */
function edCell(key,txt){
  return '<td class="ed"><div class="v" contenteditable="plaintext-only" data-k="'+key+'">'+esc(txt||'')+'</div><div class="chips">'+chipsHtml(txt||'')+'</div></td>';
}
function edHead(key,txt,ph){
  return '<th class="ed" contenteditable="plaintext-only" data-k="'+key+'" data-ph="'+ph+'">'+esc(txt||'')+'</th>';
}
function focusEnd(v){
  v.focus();
  try{var r=document.createRange();r.selectNodeContents(v);r.collapse(false);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
}

/* ---------- uploaded spreadsheets ---------- */
var wb=null;
function getEdits(name){
  cur.edits=cur.edits||{};
  var s=cur.edits[name];
  if(!s){s=cur.edits[name]={cells:{},addRows:0,addCols:0}}
  return s;
}
function nonEmpty(c){
  if(!c||c.v===undefined||c.v===null)return false;
  var t=c.w!==undefined?c.w:String(c.v);
  return String(t).trim()!=='';
}
function cellText(c){return c?(c.w!==undefined?c.w:(c.v!==undefined?String(c.v):'')):''}
function cellHtml(txt,target){
  var h=linkify(txt);
  if(target&&/^(https?:|mailto:)/i.test(target)&&h.indexOf('<a ')<0&&txt!==''){h='<a href="'+esc(target)+'">'+h+'</a>'}
  return h;
}
function buildSheet(i){
  var name=wb.SheetNames[i],ws=wb.Sheets[name],ed=getEdits(name);
  if(!ws||!ws['!ref'])return {title:'',html:'<p class="muted">This tab is empty.</p>'};
  var r=XLSX.utils.decode_range(ws['!ref']);
  function cell(R,C){return ws[XLSX.utils.encode_cell({r:R,c:C})]}
  var R,C,k,j;
  /* header row = first row with 2+ filled cells; rows above it form the title */
  var hdr=r.s.r,lim=Math.min(r.e.r,r.s.r+15);
  for(R=r.s.r;R<=lim;R++){
    var n=0;for(C=r.s.c;C<=r.e.c;C++)if(nonEmpty(cell(R,C)))n++;
    if(n>=2){hdr=R;break}
  }
  var title='';
  for(R=r.s.r;R<hdr&&!title;R++){
    for(C=r.s.c;C<=r.e.c;C++){if(nonEmpty(cell(R,C))){title=cellText(cell(R,C));break}}
  }
  /* writable = columns with a header but completely empty below it */
  var wr={};
  for(C=r.s.c;C<=r.e.c;C++){
    if(!nonEmpty(cell(hdr,C))||r.e.r<=hdr)continue;
    var all=true;
    for(R=hdr+1;R<=r.e.r;R++){if(nonEmpty(cell(R,C))){all=false;break}}
    if(all)wr[C]=1;
  }
  var hlen=0;for(C=r.s.c;C<=r.e.c;C++)hlen+=cellText(cell(hdr,C)).length;
  var headerShort=hlen<=260;
  var skip={},span={};
  (ws['!merges']||[]).forEach(function(g){
    span[g.s.r+','+g.s.c]=[g.e.r-g.s.r+1,g.e.c-g.s.c+1];
    for(var a=g.s.r;a<=g.e.r;a++)for(var b=g.s.c;b<=g.e.c;b++)if(a!==g.s.r||b!==g.s.c)skip[a+','+b]=1;
  });
  var rows=ws['!rows']||[],maxR=Math.min(r.e.r,hdr+4999),out=['<table>'];
  for(R=hdr;R<=maxR;R++){
    if(rows[R]&&rows[R].hidden)continue;
    var isH=(R===hdr);
    out.push(isH&&headerShort?'<tr class="hrow">':'<tr>');
    for(C=r.s.c;C<=r.e.c;C++){
      k=R+','+C;if(skip[k])continue;
      if(!isH&&wr[C]){out.push(edCell(k,ed.cells[k]));continue}
      var c=cell(R,C),sp=span[k],at=sp?' rowspan="'+sp[0]+'" colspan="'+sp[1]+'"':'',tg=(isH&&headerShort)?'th':'td';
      out.push('<'+tg+at+'>'+cellHtml(cellText(c),c&&c.l&&c.l.Target)+'</'+tg+'>');
    }
    for(j=0;j<ed.addCols;j++){
      k=R+','+(r.e.c+1+j);
      out.push(isH?edHead(k,ed.cells[k],'Column name'):edCell(k,ed.cells[k]));
    }
    out.push(isH?'<th class="plus"><button class="addc" aria-label="Add column">+</button></th>':'<td class="plus"></td>');
    out.push('</tr>');
  }
  for(var a=0;a<ed.addRows;a++){
    R=r.e.r+1+a;
    out.push('<tr>');
    for(C=r.s.c;C<=r.e.c+ed.addCols;C++){k=R+','+C;out.push(edCell(k,ed.cells[k]))}
    out.push('<td class="plus"></td></tr>');
  }
  out.push('</table><div class="addr"><button class="addr-btn">+ Add row</button></div>');
  return {title:title,html:out.join('')};
}
async function showSheet(buf,m){
  var e=m.ext;
  if(e==='csv'||e==='tsv'){
    var txt=new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/,'');
    wb=XLSX.read(txt,e==='tsv'?{type:'string',FS:'\t'}:{type:'string'});
  }else{
    wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  }
  var tabs=$('#tabs');tabs.classList.remove('hidden');$('#vtitle').classList.add('hidden');
  wb.SheetNames.forEach(function(n,i){
    var b=document.createElement('button');b.className='tab';b.textContent=n;
    b.addEventListener('click',function(){pickSheet(i)});tabs.appendChild(b);
  });
  pickSheet(0);
}
function paint(keepScroll){
  var sl=main.scrollLeft,st=main.scrollTop,b=buildSheet(curSheet);
  var s=$('#strip');s.textContent=b.title;s.classList.toggle('hidden',!b.title);
  content.innerHTML='<div class="fname">'+esc(cur.name)+'</div>'+b.html;
  if(keepScroll){main.scrollLeft=sl;main.scrollTop=st}
}
function pickSheet(i){
  curSheet=i;
  Array.prototype.forEach.call($('#tabs').children,function(b,j){b.classList.toggle('on',i===j)});
  paint(false);main.scrollLeft=0;main.scrollTop=0;
}

/* ---------- new tables (Create new) ---------- */
function buildGrid(){
  var g=cur.grid,out=['<table class="grid"><tr class="hrow">'];
  g.head.forEach(function(h,c){out.push(edHead('h,'+c,h,'Column name'))});
  out.push('<th class="plus"><button class="addc" aria-label="Add column">+</button></th></tr>');
  g.rows.forEach(function(row,r){
    out.push('<tr>');
    row.forEach(function(v,c){out.push(edCell(r+','+c,v))});
    out.push('<td class="plus"></td></tr>');
  });
  out.push('</table><div class="addr"><button class="addr-btn">+ Add row</button></div>');
  return out.join('');
}
function paintGrid(keepScroll){
  var sl=main.scrollLeft,st=main.scrollTop;
  $('#gtable').innerHTML=buildGrid();
  if(keepScroll){main.scrollLeft=sl;main.scrollTop=st}
}
async function showGrid(buf,m){
  var g=m.grid;
  content.innerHTML='<div class="gh"><input id="gTitle" type="text" maxlength="120" placeholder="Title (e.g. Video #801)"><input id="gSub" type="text" maxlength="160" placeholder="Subtitle (optional)"></div><div id="gtable"></div>';
  $('#gTitle').value=m.name==='Untitled table'?'':m.name;
  $('#gSub').value=g.sub||'';
  $('#gTitle').addEventListener('input',function(){
    cur.name=$('#gTitle').value.trim()||'Untitled table';
    $('#vtitle').textContent=cur.name;scheduleSave();
  });
  $('#gSub').addEventListener('input',function(){g.sub=$('#gSub').value;cur.text=gridText(g);scheduleSave()});
  $('#gTitle').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('#gSub').focus()}});
  $('#gSub').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('#gSub').blur()}});
  paintGrid(false);
  if(m.name==='Untitled table')$('#gTitle').focus();
}
function setGridCell(key,txt){
  var g=cur.grid,p=key.split(',');
  if(p[0]==='h')g.head[+p[1]]=txt;else g.rows[+p[0]][+p[1]]=txt;
  cur.text=gridText(g);
}
function gridAddRow(){
  var g=cur.grid,last=g.rows[g.rows.length-1],row=[];
  for(var c=0;c<g.head.length;c++)row.push('');
  if(last&&/^\d+$/.test((last[0]||'').trim()))row[0]=String(+last[0].trim()+1);
  g.rows.push(row);
}
function gridAddCol(){
  var g=cur.grid;g.head.push('');g.rows.forEach(function(r){r.push('')});
}

/* edits in any editable cell */
content.addEventListener('input',function(e){
  var el=e.target.closest&&e.target.closest('[data-k]');
  if(!el||!cur)return;
  var key=el.getAttribute('data-k'),txt=el.innerText.replace(/\n$/,'');
  if(kindM(cur)==='grid'){setGridCell(key,txt)}
  else if(wb){
    var ed=getEdits(wb.SheetNames[curSheet]);
    if(txt.trim()==='')delete ed.cells[key];else ed.cells[key]=txt;
  }else return;
  var td=el.closest('td'),ch=td&&td.querySelector('.chips');
  if(ch)ch.innerHTML=chipsHtml(txt);
  scheduleSave();
});
content.addEventListener('click',function(e){
  if(!cur)return;
  var isGrid=kindM(cur)==='grid';
  if(!isGrid&&!wb)return;
  if(e.target.closest('.addc')){
    if(isGrid){gridAddCol();paintGrid(true)}
    else{getEdits(wb.SheetNames[curSheet]).addCols++;paint(true)}
    scheduleSave();
    main.scrollLeft=main.scrollWidth;
    var hs=content.querySelectorAll('th.ed');if(hs.length)hs[hs.length-1].focus();
  }else if(e.target.closest('.addr-btn')){
    if(isGrid){gridAddRow();paintGrid(true)}
    else{getEdits(wb.SheetNames[curSheet]).addRows++;paint(true)}
    scheduleSave();
    var trs=content.querySelectorAll('table tr'),last=trs[trs.length-1],f=last&&last.querySelector('.v');
    if(f){focusEnd(f);f.scrollIntoView({block:'center'})}
  }else{
    /* tapping the empty part of a cell puts the cursor in it */
    var td=e.target.closest('td.ed');
    if(td&&!e.target.closest('.v,.chips')){var v=td.querySelector('.v');if(v)focusEnd(v)}
  }
});

/* ---------- blank text page (older files) ---------- */
function autosize(x){
  x.style.height='auto';
  x.style.height=Math.max(x.scrollHeight,Math.round(window.innerHeight*0.5))+'px';
}
async function showPage(buf,m){
  content.innerHTML='<div class="page"><input id="pgTitle" type="text" maxlength="120" placeholder="Title"><textarea id="pgText" placeholder="Write your research here…"></textarea></div>';
  var t=$('#pgTitle'),x=$('#pgText');
  t.value=m.name==='Untitled page'?'':m.name;
  x.value=m.text||'';
  autosize(x);
  x.addEventListener('input',function(){cur.text=x.value;cur.size=x.value.length;autosize(x);scheduleSave()});
  t.addEventListener('input',function(){cur.name=t.value.trim()||'Untitled page';$('#vtitle').textContent=cur.name;scheduleSave()});
  t.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();x.focus()}});
}

/* ---------- PDF ---------- */
var pdfDoc=null,pdfZoom=1,pdfObs=null,pdfTok=0;
async function showPdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
  pdfZoom=1;
  await renderPdf(null);
}
async function renderPdf(anchor){
  var tok=++pdfTok,doc=pdfDoc;
  var baseW=Math.max(240,Math.min(main.clientWidth||window.innerWidth,900)-8);
  var wrap=document.createElement('div');wrap.className='pdfwrap';
  var boxes=[];
  for(var p=1;p<=doc.numPages;p++){
    var page=await doc.getPage(p);
    if(tok!==pdfTok)return;
    var v0=page.getViewport({scale:1}),vp=page.getViewport({scale:baseW*pdfZoom/v0.width});
    var box=document.createElement('div');box.className='pg';
    box.style.width=vp.width+'px';box.style.height=vp.height+'px';
    box._page=page;box._vp=vp;wrap.appendChild(box);boxes.push(box);
  }
  if(tok!==pdfTok)return;
  if(pdfObs)pdfObs.disconnect();
  content.replaceChildren(wrap);
  if(anchor){
    main.scrollLeft=(anchor.sl+anchor.mx)*anchor.r-anchor.mx;
    main.scrollTop=anchor.h+anchor.y*anchor.r-anchor.my;
  }
  pdfObs=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting&&!en.target._done){en.target._done=true;drawPage(en.target)}});
  },{root:main,rootMargin:'900px 0px'});
  boxes.forEach(function(b){pdfObs.observe(b)});
}
async function drawPage(box){
  var page=box._page,vp=box._vp,dpr=pdfZoom>1?1:Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement('canvas');
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  box.appendChild(cv);
  try{
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:undefined}).promise;
    var ann=await page.getAnnotations({intent:'display'});
    ann.forEach(function(a){
      if(a.subtype!=='Link'||!a.url)return;
      var q=vp.convertToViewportRectangle(a.rect),l=document.createElement('a');
      l.href=a.url;l.className='pdflink';
      l.style.left=Math.min(q[0],q[2])+'px';l.style.top=Math.min(q[1],q[3])+'px';
      l.style.width=Math.abs(q[2]-q[0])+'px';l.style.height=Math.abs(q[3]-q[1])+'px';
      box.appendChild(l);
    });
  }catch(e){}
}

/* ---------- two-finger pinch zoom ---------- */
var pz={on:false};
function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
function isPdf(){return cur&&kindM(cur)==='pdf'}
function applyPinch(){
  if(!pz.on)return;
  pz.raf=0;
  if(isPdf()){
    var w=content.firstChild;
    if(w&&w.style){w.style.transformOrigin=(pz.sl+pz.mx)+'px '+pz.y+'px';w.style.transform='scale('+pz.r+')'}
  }else{
    content.style.setProperty('--z',pz.z0*pz.r);
    main.scrollLeft=(pz.sl+pz.mx)*pz.r-pz.mx;
    main.scrollTop=pz.h+pz.y*pz.r-pz.my;
  }
}
main.addEventListener('touchstart',function(e){
  if(e.touches.length!==2||!cur)return;
  var rc=main.getBoundingClientRect(),t=e.touches,h=content.offsetTop;
  var my=(t[0].clientY+t[1].clientY)/2-rc.top;
  pz={on:true,d0:dist(t),z0:isPdf()?pdfZoom:zoom,r:1,raf:0,h:h,
      mx:(t[0].clientX+t[1].clientX)/2-rc.left,my:my,
      sl:main.scrollLeft,st:main.scrollTop,y:Math.max(0,main.scrollTop+my-h)};
},{passive:true});
main.addEventListener('touchmove',function(e){
  if(!pz.on||e.touches.length!==2)return;
  var z=Math.max(0.5,Math.min(isPdf()?4:3.5,pz.z0*dist(e.touches)/pz.d0));
  pz.r=z/pz.z0;
  if(!pz.raf)pz.raf=requestAnimationFrame(applyPinch);
},{passive:true});
function endPinch(e){
  if(!pz.on||e.touches.length>=2)return;
  var p=pz;pz={on:false};
  if(p.raf)cancelAnimationFrame(p.raf);
  var z=p.z0*p.r;
  if(isPdf()){
    var w=content.firstChild;if(w&&w.style)w.style.transform='';
    if(Math.abs(p.r-1)>0.02){pdfZoom=z;renderPdf({r:p.r,mx:p.mx,my:p.my,sl:p.sl,h:p.h,y:p.y})}
  }else{
    zoom=z;content.style.setProperty('--z',z);
    if(cur&&kindM(cur)==='page'){var tx=$('#pgText');if(tx)autosize(tx)}
    main.scrollLeft=(p.sl+p.mx)*p.r-p.mx;main.scrollTop=p.h+p.y*p.r-p.my;
  }
}
main.addEventListener('touchend',endPinch,{passive:true});
main.addEventListener('touchcancel',endPinch,{passive:true});

/* ---------- Word, images, text ---------- */
async function showDocx(buf){
  var r=await mammoth.convertToHtml({arrayBuffer:buf});
  content.innerHTML='<div class="doc">'+r.value+'</div>';
}
async function showImg(buf,m){
  var u=URL.createObjectURL(new Blob([buf],{type:MIME[m.ext]||'image/*'}));
  blobUrls.push(u);
  content.innerHTML='<div class="imgw"><img alt="'+esc(m.name)+'" src="'+u+'"></div>';
}
async function showText(buf){
  content.innerHTML='<pre class="txt">'+linkify(new TextDecoder('utf-8').decode(buf))+'</pre>';
}
async function showOther(buf,m){
  try{
    var s=new TextDecoder('utf-8',{fatal:true}).decode(buf.slice(0,Math.min(buf.byteLength,200000)));
    if(!/[\u0000-\u0008\u000E-\u001F]/.test(s)){await showText(buf);return}
  }catch(e){}
  content.innerHTML='<p class="muted">This format (.'+esc(m.ext||'unknown')+') cannot be displayed yet. The file stays saved in your library.</p>';
}

/* ---------- start ---------- */
renderList();
})();
