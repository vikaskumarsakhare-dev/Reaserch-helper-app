<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>रिसर्च संग्रह</title>
<style>
:root{--bg:#0e1a2b;--card:#162338;--card2:#1e2f49;--line:#2a3d5c;--tx:#e6eef7;--mut:#8aa0bd;--ac:#2dd4bf;--acd:#042a26;--danger:#ff8b84;--zb:#112036;--fs:1}
[data-theme=light]{--bg:#f4f7fb;--card:#ffffff;--card2:#e8eef6;--line:#cdd8e6;--tx:#14202e;--mut:#586a82;--ac:#0b8a7d;--acd:#ffffff;--danger:#c93a31;--zb:#eef3f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35}
a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar svg{flex:none;border-radius:8px}
.ver{font-size:12px;color:var(--mut)}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;line-height:1;flex:none}
.title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=search],input[type=text]{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.sr{padding:10px 14px;flex:none}
.sr input{background:var(--card)}

/* Home */
#hbody{flex:1;overflow:auto;padding:0 14px 110px}
#hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 2px}
.row{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.row:active{background:var(--card2)}
.ic{font-size:26px;width:40px;text-align:center;flex:none}
.mt{flex:1;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snip{font-size:13px;color:var(--tx);opacity:.85;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snip mark{background:rgba(45,212,191,.3);color:inherit;border-radius:3px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--c,var(--line));color:var(--c,var(--mut))}
.chip.tag{--c:var(--mut)}
.more{border:0;background:none;color:var(--mut);font-size:22px;line-height:1;padding:10px 14px;flex:none}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
#fab{position:fixed;z-index:16;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;border:0;background:var(--ac);color:var(--acd);font-size:36px;line-height:1;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
#fab.open{transform:rotate(45deg)}
#scrim{position:fixed;inset:0;z-index:14;background:transparent}
#fabmenu{position:fixed;z-index:15;right:20px;bottom:calc(22px + 62px + 24px + env(safe-area-inset-bottom,0px));min-width:200px;background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.5);overflow:hidden;transform-origin:bottom right;animation:pop .12s ease-out}
#fabmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px;text-align:left}
#fabmenu button:last-child{border-bottom:0}
#fabmenu button:active{background:var(--card)}
#fabmenu b{color:var(--ac);width:1.2em;text-align:center;font-weight:600}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* Settings / trash */
.pane{flex:1;overflow:auto;padding:8px 14px 40px}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line)}
.setrow label{flex:1}
.setrow small{display:block;color:var(--mut);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:8px 14px;font-size:14px}
.seg button.on{background:var(--ac);color:var(--acd);font-weight:700}
.setrow input[type=range]{width:46%;accent-color:var(--ac)}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:14px;font-weight:600}
.btn.fill{background:var(--ac);color:var(--acd)}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.note-s{color:var(--mut);font-size:13px;padding:10px 4px}

/* Viewer */
#tabs{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto}
.tab{flex:none;padding:8px 14px;border-radius:10px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.pbtn{flex:none;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:13px;font-weight:700}
#strip{flex:none;padding:4px 12px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
#main{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;min-height:0}
#content{--z:1;min-height:100px;position:relative}
.fname{padding:6px 12px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--mut);padding:18px 14px}
.flash{position:fixed;background:rgba(255,200,0,.45);border-radius:3px;pointer-events:none;animation:fl 2.2s ease-out forwards}
@keyframes fl{0%,60%{opacity:1}100%{opacity:0}}

table{border-collapse:separate;border-spacing:0;font-size:calc(13px*var(--z)*var(--fs));line-height:1.35}
th,td{min-width:8.5em;max-width:22em;padding:.4em .6em;vertical-align:top;white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
th{background:var(--card2);color:var(--ac);font-weight:600;font-size:.92em}
tr.hrow th{position:sticky;top:0;z-index:2}
tr:nth-child(even) td{background:var(--zb)}
td.ed{padding:0}
td.ed,tr:nth-child(even) td.ed{background:rgba(45,212,191,.08)}
td.ed:focus-within{outline:2px solid var(--ac);outline-offset:-2px}
td.gc{padding:0}
.hv:empty::before{content:attr(data-ph);opacity:.5}
td.gc:focus-within{outline:2px solid var(--ac);outline-offset:-2px}
.v,.hv{padding:.4em .6em;min-height:2.3em;outline:none;white-space:pre-wrap;word-break:break-word}
.hv{min-height:1.4em;padding-right:1.6em}
th.gh{position:relative}
th.gh .cm{position:absolute;right:.15em;top:.25em;width:1.5em;height:1.5em;border:0;background:transparent;color:var(--mut);font-size:1em;line-height:1;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:.3em;padding:0 .5em .45em}
.chips:empty{display:none}
.chips a{font-size:.86em;padding:.12em .55em;border:1px solid var(--ac);border-radius:.6em;text-decoration:none;white-space:nowrap}
th.ed{outline:none}
th.ed:focus{outline:2px solid var(--ac);outline-offset:-2px}
th.ed:empty::before{content:attr(data-ph);opacity:.55}
th.plus,td.plus{min-width:0;width:3em;max-width:none;text-align:center;padding:.3em;background:var(--bg)}
th.rh,td.rh{min-width:0;width:2.6em;max-width:none;padding:.2em;text-align:center;background:var(--card2)}
td.rh{background:var(--bg)}
.rb{width:2em;height:2em;border-radius:.6em;border:0;background:transparent;color:var(--mut);font-size:1em;line-height:1}
.rb.st-ok{color:#2fbf71}.rb.st-warn{color:#f0b429}.rb.st-chk{color:#ef5350}
.addc{width:2em;height:2em;border-radius:.6em;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:1em;line-height:1}
.addr{padding:12px 12px 90px}
.addr-btn{padding:10px 16px;border-radius:10px;border:1px dashed var(--ac);background:transparent;color:var(--ac);font-size:14px}
table.grid th:nth-child(2),table.grid td:nth-child(2){min-width:3.2em;max-width:5em}
.gh{padding:12px 14px 10px;text-align:center}
.gh input{display:block;width:100%;text-align:center;background:transparent;border:0;border-radius:0;padding:4px 0;color:var(--tx)}
.gh input:focus{outline:none;border-bottom:1px solid var(--ac)}
#gTitle{font-size:calc(21px*var(--z)*var(--fs));font-weight:700}
#gSub{font-size:calc(14px*var(--z)*var(--fs));color:var(--mut)}

pre.txt{white-space:pre-wrap;word-break:break-word;padding:14px;margin:0;font:calc(13px*var(--z)*var(--fs))/1.7 ui-monospace,Menlo,monospace}
.imgw{padding:10px}.imgw img{width:calc(100%*var(--z));max-width:none;height:auto;border-radius:6px;display:block}
.doc{background:#fff;color:#161616;padding:14px;margin:10px 12px;border-radius:10px;line-height:1.6;word-break:break-word;font-size:calc(15px*var(--z)*var(--fs))}
.doc a{color:#0b57d0}.doc img{max-width:100%;height:auto}
.doc table{border-collapse:collapse;font-size:inherit}.doc td,.doc th{border:1px solid #ccc;background:#fff;color:#161616;padding:5px 8px;min-width:0;position:static}
.pdfwrap{padding:6px 0;width:100%}
.pg{position:relative;margin:0 auto 8px;background:#fff}
.pdflink{position:absolute;display:block}
.pann{position:absolute;left:0;top:0}
.pann.on{touch-action:none}

/* Note editor */
#content.note{height:100%}
.nt{display:flex;flex-direction:column;height:100%;padding:10px 14px 0}
#ntTitle{flex:none;font-size:calc(20px*var(--z)*var(--fs));font-weight:700;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;margin-bottom:8px}
#ntTitle:focus{outline:none;border-color:var(--ac)}
#ntEd{flex:1;min-height:0;overflow:auto;outline:none;font-size:calc(16px*var(--z)*var(--fs));line-height:1.7;padding:4px 0 40px;word-break:break-word;-webkit-user-select:text;user-select:text}
#ntEd:empty::before{content:attr(data-ph);color:var(--mut)}
#ntEd h1{font-size:1.5em;margin:.3em 0}#ntEd h2{font-size:1.25em;margin:.3em 0}#ntEd h3{font-size:1.1em;margin:.3em 0}
#ntEd ul,#ntEd ol{margin:.2em 0;padding-left:1.4em}
#ntCount{flex:none;font-size:12px;color:var(--mut);padding:6px 0 8px}
#nfind{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card)}
#nfind input{flex:1 1 40%;min-width:100px;padding:8px 10px}
#nfind button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-size:13px}
#nfind .fc{flex:1 1 100%;font-size:12px;color:var(--mut)}
#nplay{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card);font-size:13px}
#nplay span{flex:1}
#nplay button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}

/* bottom tool bar */
#fbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--card);overflow-x:auto}
#fbar .grp{display:flex;gap:6px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
#fbar .grp:last-child{border-right:0}
#fbar button{flex:none;min-width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:15px;padding:0 8px}
#fbar button.on{background:var(--ac);color:var(--acd);border-color:var(--ac)}
#fbar b{font-weight:800}#fbar i{font-style:italic}#fbar u{text-decoration:underline}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.pal{display:flex;flex-wrap:wrap;gap:12px;padding:6px 0 8px}
.pal button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--c)}

/* teleprompter */
#tele{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
#teleBox{flex:1;overflow:auto;padding:30px 22px 70vh;font-size:36px;line-height:1.55;-webkit-user-select:none}
#teleBox p{margin:0 0 .7em}
#teleBox.mir{transform:scaleX(-1)}
#teleCtl{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:#111;flex-wrap:wrap}
#teleCtl button{min-width:44px;height:44px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:16px;padding:0 10px}
#teleCtl button.on{background:var(--ac);color:var(--acd)}
#teleCtl span{color:#bbb;font-size:13px;min-width:56px;text-align:center}

/* PDF page manager */
#pgrid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.pth{position:relative;border:2px solid var(--line);border-radius:8px;background:var(--card);padding:4px;text-align:center}
.pth.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.pth .box{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.pth canvas{max-width:100%;max-height:100%;transition:transform .15s}
.pth small{display:block;color:var(--mut);font-size:11px;padding-top:2px}
#pbar{flex:none;display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);overflow-x:auto;background:var(--card)}
#pbar button{flex:none;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:14px}
#pbar button.pri{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}

/* Dialogs */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,8,16,.62)}
#mbody{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#mbody h2{font-size:16px;margin:0 0 6px;word-break:break-word}
.msg{color:var(--mut);font-size:14px;margin-top:8px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;padding:14px 6px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px}
.opt:last-child{border-bottom:0}
.opt.danger{color:var(--danger)}
.opt small{display:block;color:var(--mut);font-size:12px}
.mrow{display:flex;gap:10px;margin-top:14px}
.mbtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.mbtn.pri{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.mbtn.dng{background:#d9453d;border-color:#d9453d;color:#fff;font-weight:700}
#mbody textarea{width:100%;min-height:180px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,monospace}
#busy{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,8,16,.7)}
#busy .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:220px;text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:88%}
.hv:empty::before{content:attr(data-ph);opacity:.5}

</style>
</head>
<body>
<div id="home" class="screen">
  <div class="bar">
    <button id="hback" class="ibtn hidden" aria-label="Back">←</button>
    <svg id="hlogo" width="34" height="34" viewBox="0 0 432 432" aria-hidden="true"><rect width="432" height="432" rx="95" fill="#0e1a2b"/><g transform="translate(216 216) scale(1.15) translate(-216 -216)"><rect x="150" y="120" width="112" height="180" rx="14" fill="#e8f1f5"/><rect x="166" y="142" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="166" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="190" width="80" height="9" rx="4.5" fill="#5a6e87"/><rect x="166" y="214" width="46" height="9" rx="4.5" fill="#5a6e87"/><circle cx="244" cy="256" r="34" fill="#0e1a2b" stroke="#2dd4bf" stroke-width="16"/><line x1="274" y1="286" x2="298" y2="310" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round"/></g></svg>
    <h1 id="htitle">रिसर्च संग्रह</h1>
    <span class="ver" id="ver"></span>
    <button id="hmore" class="ibtn" aria-label="Menu">⋮</button>
  </div>
  <div class="sr"><input id="hsearch" type="search" data-i18n-ph="Search files and text"></div>
  <div id="hbody"><div id="hlist"></div><div id="empty" class="empty hidden"></div></div>
</div>

<div id="trash" class="screen hidden">
  <div class="bar"><button id="trback" class="ibtn" aria-label="Back">←</button><h1 data-i18n="Trash">Trash</h1><button id="trempty" class="pbtn" data-i18n="Empty trash">Empty trash</button></div>
  <div class="pane"><div class="note-s" data-i18n="Items are deleted for good after 30 days.">Items are deleted for good after 30 days.</div><div id="trlist"></div></div>
</div>

<div id="settings" class="screen hidden">
  <div class="bar"><button id="seback" class="ibtn" aria-label="Back">←</button><h1 data-i18n="Settings">Settings</h1></div>
  <div class="pane" id="setpane"></div>
</div>

<div id="viewer" class="screen hidden">
  <div id="top" class="bar">
    <button id="back" class="ibtn" aria-label="Back">←</button>
    <div id="tabs" class="hidden"></div>
    <div id="vtitle" class="title"></div>
    <button id="pdfBtn" class="pbtn" aria-label="Download PDF">PDF</button>
    <button id="moreBtn" class="ibtn" aria-label="More">⋮</button>
  </div>
  <div id="strip" class="hidden"></div>
  <div id="main"><div id="content"></div></div>
  <div id="nfind" class="hidden">
    <input id="fq" type="text" data-i18n-ph="Find"><input id="fr" type="text" data-i18n-ph="Replace with">
    <button id="fprev">◀</button><button id="fnext">▶</button><button id="frep" data-i18n="Replace">Replace</button><button id="frepall" data-i18n="Replace all">Replace all</button><button id="fclose">✕</button>
    <div class="fc" id="fcount"></div>
  </div>
  <div id="nplay" class="hidden"><span id="nplayMsg"></span><button id="nplayPause">❚❚</button><button id="nplayStop">■</button></div>
  <div id="fbar" class="hidden">
    <div class="grp" data-g="undo"><button id="bUndo" aria-label="Undo">↶</button><button id="bRedo" aria-label="Redo">↷</button></div>
    <div class="grp" data-g="fmt">
      <button id="bB"><b>B</b></button><button id="bI"><i>I</i></button><button id="bU" data-n="1"><u>U</u></button>
      <button id="bMinus">A−</button><button id="bPlus">A+</button>
      <button id="bCol"><span class="sw" style="background:#e53935"></span></button><button id="bHl"><span class="sw" style="background:#ffeb3b"></span></button>
    </div>
    <div class="grp" data-g="note">
      <button id="bList">•≡</button><button id="bNum">1.</button><button id="bHead">H</button><button id="bAlign">≣</button>
      <button id="bTable" data-i18n="→ Table">→ Table</button>

function ext(n){var p=String(n).split('.');return p.length>1?p.pop().toLowerCase():''}
/* the file type is stored separately, so renaming never changes how a file opens */
function fix(m){
  if(m.ext===undefined)m.ext=ext(m.name);
  if(!m.edits)m.edits={};
  if(!m.tags)m.tags=[];
  if(m.kind==='page')m.kind='note';
  if(m.parent===undefined)m.parent=null;
  return m;
}
function kindM(m){return m.kind||KIND[m.ext]||'other'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var URLRE=/https?:\/\/[^\s<>"\u0900-\u097F]+/g;
function linkify(s){
  return esc(s).replace(URLRE,function(u){
    var m=u.match(/[.,;:!?)\]]+$/),tail=m?m[0]:'',url=tail?u.slice(0,-tail.length):u;
    return '<a href="'+url+'">'+url+'</a>'+tail;
  });
}
function urlsIn(s){
  var seen={},out=[];
  (String(s).match(URLRE)||[]).forEach(function(u){u=u.replace(/[.,;:!?)\]]+$/,'');if(!seen[u]){seen[u]=1;out.push(u)}});
  return out;
}
/* small tappable chips under a cell for every link written in it */
function chipsHtml(s){
  return urlsIn(s).slice(0,4).map(function(u){
    var host=u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0];
    return '<a href="'+esc(u)+'">↗ '+esc(host)+'</a>';
  }).join('');
}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB'}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function toast(m){var e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.add('hidden')},2800)}
function tick(){return new Promise(function(r){setTimeout(r,30)})}
function words(s){s=String(s).trim();return s?s.split(/\s+/).length:0}
function baseName(m){var s='.'+m.ext;return(m.ext&&m.name.toLowerCase().slice(-s.length)===s)?m.name.slice(0,-s.length):m.name}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|]/g,'-').trim()||'document'}

  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
});
function run(names,mode,fn){
  return dbp.then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(names,mode),out;
    try{out=fn(tx)}catch(e){rej(e);return}
    tx.oncomplete=function(){res(out&&out.result)};
    tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
  })});
}
function allMeta(){return run(['meta'],'readonly',function(x){return x.objectStore('meta').getAll()})}
function getMeta(id){return run(['meta'],'readonly',function(x){return x.objectStore('meta').get(id)})}
function getData(id){return run(['data'],'readonly',function(x){return x.objectStore('data').get(id)})}
function putMeta(m){return run(['meta'],'readwrite',function(x){return x.objectStore('meta').put(m)})}
function putData(id,buf){return run(['data'],'readwrite',function(x){return x.objectStore('data').put({id:id,buf:buf})})}
function addFile(m,buf){return run(['meta','data'],'readwrite',function(x){x.objectStore('meta').put(m);return x.objectStore('data').put({id:m.id,buf:buf})})}
function addFolderMeta(m){return putMeta(m)}
function delFile(id){return run(['meta','data'],'readwrite',function(x){x.objectStore('meta').delete(id);return x.objectStore('data').delete(id)})}
function delData(id){return run(['data'],'readwrite',function(x){return x.objectStore('data').delete(id)})}

/* ================= saving files to the phone (share sheet) ================= */
function b64(u8){
  var s='',i,step=0x8000;
  for(i=0;i<u8.length;i+=step)s+=String.fromCharCode.apply(null,u8.subarray(i,i+step));
  return btoa(s);
}
async function saveBytes(bytes,fn,mime){
  var C=window.Capacitor,P=C&&C.Plugins,FS=P&&P.Filesystem,SH=P&&P.Share;
  if(FS&&SH){
    var dir='out/'+Date.now()+'/',path=dir+fn,CH=900000,o;
    try{await FS.rmdir({path:'out',directory:'CACHE',recursive:true})}catch(e){}
    for(o=0;o<bytes.length;o+=CH){
      var part=b64(bytes.subarray(o,o+CH));
      if(o===0)await FS.writeFile({path:path,data:part,directory:'CACHE',recursive:true});
      else await FS.appendFile({path:path,data:part,directory:'CACHE'});
    }
    var u=await FS.getUri({path:path,directory:'CACHE'});
    try{await SH.share({title:fn,files:[u.uri],dialogTitle:t('Save or share')})}
    catch(e){if(!/cancel/i.test(String(e&&e.message||e)))throw e}
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bytes],{type:mime||'application/octet-stream'}));
  a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
}
function saveText(txt,fn,mime,bom){
  var enc=new TextEncoder().encode((bom?'\uFEFF':'')+txt);
  return saveBytes(enc,fn,mime);
}

/* ================= open links in Chrome ================= */
function openExternal(u){
  try{var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.Browser){C.Plugins.Browser.open({url:u});return}}catch(e){}
  window.open(u,'_blank');
}
document.addEventListener('click',function(e){

  if(a.hasAttribute('download'))return;

});

/* clipboard */
async function copyText(s){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(s);return true}}catch(e){}
  try{
    var ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){return false}
}

async function loadItems(){ITEMS=((await allMeta())||[]).map(fix);return ITEMS}
function live(){return ITEMS.filter(function(m){return !m.deleted})}
function byId(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i];return null}
function effParent(m){
  if(!m.parent)return null;
  var p=byId(m.parent);
  return(p&&!p.deleted)?m.parent:null;
}
function folders(){return live().filter(function(m){return kindM(m)==='folder'})}
function sortFn(a,b){return(b.pinned?1:0)-(a.pinned?1:0)||b.opened-a.opened}
function stageInfo(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===k)return STAGES[i];return null}

function hay(m){
  var s=[m.name,(m.tags||[]).join(' '),m.text||'',m.idx||''];
  if(m.grid)s.push(gridText(m.grid));
  if(m.edits)Object.keys(m.edits).forEach(function(k){
    var c=m.edits[k]&&m.edits[k].cells;
    if(c)Object.keys(c).forEach(function(x){s.push(c[x])});
  });
  return s.join('\n');
}
function snippet(m,q){
  var h=hay(m),i=h.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return '';
  var a=Math.max(0,i-32),b=Math.min(h.length,i+q.length+55);
  var seg=h.slice(a,b).replace(/[\r\n\t]/g,' '),r=i-a;
  return(a>0?'…':'')+esc(seg.slice(0,r))+'<mark>'+esc(seg.slice(r,r+q.length))+'</mark>'+esc(seg.slice(r+q.length))+(b<h.length?'…':'');
}
function subLine(m){
  var k=kindM(m),d=fmtDate(m.opened);
  if(k==='folder'){
    var n=live().filter(function(x){return effParent(x)===m.id}).length;
    return n+' '+t(n===1?'file':'files');
  }
  if(k==='note'){var w=m.words;if(w===undefined)w=words(m.text||'');return d+' · '+t('Note')+' · '+w.toLocaleString('en-US')+' '+t(w===1?'word':'words')}
  if(k==='grid'){var n2=(m.grid&&m.grid.rows&&m.grid.rows.length)||0;return d+' · '+t('Table')+' · '+n2+' '+t(n2===1?'row':'rows')}
  return d+' · '+fmtSize(m.size||0)+(hasEdits(m)?' · '+t('Edited'):'');
}
function hasEdits(m){
  var e=m.edits;if(!e)return false;
  return Object.keys(e).some(function(k){var s=e[k];return s&&(s.addRows||s.addCols||Object.keys(s.cells||{}).length||Object.keys(s.st||{}).length)});
}
function rowHtml(m,ctx){
  var k=kindM(m),sub=subLine(m),chips='';
  if(ctx&&ctx.path){var p=effParent(m);if(p){var pf=byId(p);if(pf)sub='📁 '+pf.name+' · '+sub}}
  if(k==='folder'&&m.stage){var si=stageInfo(m.stage);if(si)chips+='<span class="chip" style="--c:'+si[2]+'">'+t(si[1])+'</span>'}
  (m.tags||[]).forEach(function(g){chips+='<span class="chip tag">#'+esc(g)+'</span>'});
  var sn=(ctx&&ctx.q)?snippet(m,ctx.q):'';
  return '<div class="row" data-id="'+m.id+'"><div class="ic">'+ICON[k]+'</div><div class="mt"><div class="nm">'+(m.pinned?'📌 ':'')+esc(m.name)+'</div><div class="sb">'+sub+'</div>'+
    (chips?'<div class="chips2">'+chips+'</div>':'')+(sn?'<div class="snip">'+sn+'</div>':'')+
    '</div><button class="more" data-more="'+m.id+'" aria-label="Options">⋮</button></div>';
}
function renderHomeBar(){
  var f=curFolder?byId(curFolder):null;
  $('#hback').classList.toggle('hidden',!f);
  $('#hlogo').classList.toggle('hidden',!!f);
  $('#ver').classList.toggle('hidden',!!f);
  $('#htitle').textContent=f?f.name:'रिसर्च संग्रह';

async function renderList(noLoad){
  if(!noLoad)await loadItems();
  if(curFolder){var cf=byId(curFolder);if(!cf||cf.deleted)curFolder=null}
  renderHomeBar();
  var q=$('#hsearch').value.trim(),L=live(),html='',total=0;
  if(q){
    var ql=q.toLowerCase();
    var hits=L.filter(function(m){return hay(m).toLowerCase().indexOf(ql)>-1});
    hits.sort(function(a,b){
      var an=a.name.toLowerCase().indexOf(ql)>-1?1:0,bn=b.name.toLowerCase().indexOf(ql)>-1?1:0;
      return(bn-an)||sortFn(a,b);
    });
    total=hits.length;
    html=hits.map(function(m){return rowHtml(m,{q:q,path:true})}).join('');
    if(!total)$('#empty').innerHTML='<b>'+t('No matches')+'</b>'+t('Try another word.');
  }else{
    var inF=L.filter(function(m){return effParent(m)===curFolder}).sort(sortFn);
    var fl=inF.filter(function(m){return kindM(m)==='folder'}),fi=inF.filter(function(m){return kindM(m)!=='folder'});
    total=inF.length;
    if(fl.length){if(fi.length)html+='<div class="sec">'+t('Folders')+'</div>';html+=fl.map(function(m){return rowHtml(m)}).join('')}
    if(fi.length){if(fl.length)html+='<div class="sec">'+t(curFolder?'Files':'Files without folder')+'</div>';html+=fi.map(function(m){return rowHtml(m)}).join('')}
    if(!total)$('#empty').innerHTML=curFolder?('<b>'+t('This folder is empty')+'</b>'+t('Tap + to add a file or a note.')):('<b>'+t('No files yet')+'</b>'+t('Tap + to make a folder, add a file or write a note.'));
  }
  $('#hlist').innerHTML=html;
  $('#empty').classList.toggle('hidden',total>0);
}

/* ---------- creating things ---------- */
function baseMeta(name,kind,extra){
  var now=Date.now();
  return Object.assign({id:newId(),name:name,ext:'',kind:kind,parent:curFolder,tags:[],pinned:false,size:0,added:now,opened:now,edits:{}},extra||{});
}
async function newFolder(){
  var name=await askInput(t('New folder'),'',t('For example one folder for each video.'));
  if(name===null||!name.trim())return;
  var m=baseMeta(name.trim(),'folder',{parent:null,stage:''});
  await putMeta(m);await renderList();
}
async function createGrid(opt){
  var m=baseMeta('Untitled table','grid',{grid:newGridData(),text:''});
  if(opt&&opt.parent!==undefined)m.parent=opt.parent;
  await addFile(m,new ArrayBuffer(0));
  if(opt&&opt.silent)return m;
  await renderList();openFile(m.id);
}
async function createNote(opt){
  var m=baseMeta('Untitled note','note',{text:'',html:'',words:0});
  if(opt&&opt.parent!==undefined)m.parent=opt.parent;
  if(opt&&opt.name)m.name=opt.name;
  if(opt&&opt.text!==undefined){m.text=opt.text;m.html=textToHtml(opt.text);m.words=words(opt.text)}
  await addFile(m,new ArrayBuffer(0));
  if(opt&&opt.silent)return m;
  await renderList();openFile(m.id);
}
async function addFiles(fs){
  var ids=[];
  for(var i=0;i<fs.length;i++){
    var f=fs[i];
    try{
      var buf=await f.arrayBuffer(),nm=f.name||'File';
      var m=baseMeta(nm,undefined,{ext:ext(nm),size:buf.byteLength});
      delete m.kind;
      await addFile(m,buf);ids.push(m.id);
    }catch(e){toast(t('Could not add')+': '+(f.name||''))}
  }
  await renderList();
  if(fs.length===1&&ids.length)openFile(ids[0]);
  else if(ids.length)toast(t('Files added'));
  indexLater(ids);
}
/* text of uploaded files is read in the background so the search can find words inside them */
async function indexLater(ids){
  for(var i=0;i<ids.length;i++){try{await indexFile(ids[i])}catch(e){}}
}
async function indexFile(id){
  var m=await getMeta(id),d=await getData(id);if(!m||!d)return;
  fix(m);var k=kindM(m),buf=d.buf,s='';
  if(k==='sheet'){
    var w=readWb(buf,m),parts=[];
    w.SheetNames.forEach(function(n){
      var ws=w.Sheets[n];parts.push(n);
      Object.keys(ws).forEach(function(a){if(a[0]!=='!'&&ws[a]&&ws[a].v!==undefined)parts.push(ws[a].w!==undefined?ws[a].w:ws[a].v)});
    });
    s=parts.join(' ');
  }else if(k==='docx'){s=(await mammoth.extractRawText({arrayBuffer:buf})).value}
  else if(k==='text'){s=new TextDecoder('utf-8').decode(buf)}
  else if(k==='pdf'){s=await pdfPlainText(buf,120)}
  else return;
  m.idx=String(s).slice(0,150000);
  var cur2=await getMeta(id);if(!cur2)return;
  cur2.idx=m.idx;await putMeta(cur2);
}

/* ---------- item menus ---------- */
async function pickFolder(excludeId){
  await loadItems();
  var opts=[{k:'__root',label:t('No folder (Files without folder)')}];
  folders().filter(function(f){return f.id!==excludeId}).sort(sortFn).forEach(function(f){opts.push({k:f.id,label:'📁 '+f.name})});
  opts.push({k:'__new',label:'＋ '+t('New folder')});
  var r=await askSheet(t('Move to folder'),opts);
  if(r==='__new'){
    var name=await askInput(t('New folder'),'');
    if(name===null||!name.trim())return undefined;
    var m=baseMeta(name.trim(),'folder',{parent:null,stage:''});
    await putMeta(m);return m.id;
  }
  if(r==='__root')return null;
  return r===null?undefined:r;
}
function parseTags(s){
  return String(s).split(/[,\s]+/).map(function(x){return x.replace(/^#/,'').trim()}).filter(Boolean).slice(0,8);
}
async function itemMenu(id){
  await loadItems();
  var m=byId(id);if(!m)return;
  var k=kindM(m),isF=k==='folder',opts=[];
  opts.push({k:'rename',label:t('Rename')});
  if(!isF)opts.push({k:'move',label:t('Move to folder')});
  opts.push({k:'pin',label:t(m.pinned?'Unpin':'Pin to top')});
  opts.push({k:'tags',label:t('Tags'),sub:(m.tags||[]).map(function(x){return '#'+x}).join(' ')});
  if(isF)opts.push({k:'stage',label:t('Video stage'),sub:m.stage?t(stageInfo(m.stage)[1]):''});
  if(!isF&&k!=='other')opts.push({k:'pdf',label:t('Download as PDF')});
  if(!isF&&(k==='sheet'||k==='grid'||k==='note'))opts.push({k:'export',label:t('Export as…')});
  opts.push({k:'links',label:t('Copy all links')});
  opts.push({k:'del',label:t('Delete'),cls:'danger'});
  var a=await askSheet(m.name,opts);
  if(a)itemAction(m.id,a);
}
async function itemAction(id,a){
  await loadItems();
  var m=byId(id);if(!m)return;
  if(a==='rename'){
    var v=await askInput(t('Rename'),baseName(m),m.ext?t('The file type stays the same.'):'');
    if(v===null)return;
    v=safeName(v);
    var s='.'+m.ext;
    if(m.ext&&v.toLowerCase().slice(-s.length)===s)v=v.slice(0,-s.length).trim();
    if(!v){toast(t('Name cannot be empty'));return}
    m.name=v+(m.ext?s:'');await putMeta(m);renderList();toast(t('Renamed'));
  }else if(a==='move'){
    var p=await pickFolder(null);if(p===undefined)return;
    m.parent=p;await putMeta(m);renderList();toast(t('Moved'));
  }else if(a==='pin'){m.pinned=!m.pinned;await putMeta(m);renderList()}
  else if(a==='tags'){
    var tv=await askInput(t('Tags'),(m.tags||[]).join(', '),t('Separate with commas, for example: law, election'));
    if(tv===null)return;
    m.tags=parseTags(tv);await putMeta(m);renderList();
  }else if(a==='stage'){
    var opts=[{k:'__none',label:t('No stage')}].concat(STAGES.map(function(x){return {k:x[0],label:t(x[1])}}));
    var st=await askSheet(t('Video stage'),opts);
    if(st===null)return;
    m.stage=st==='__none'?'':st;await putMeta(m);renderList();
  }else if(a==='pdf'){startExport(id,false)}
  else if(a==='export'){exportMenu(id)}
  else if(a==='links'){showLinks(id)}
  else if(a==='del'){
    var ok=await askConfirm(t('Delete')+'?',m.name+' — '+t('It goes to the Trash and can be restored for 30 days.'),t('Delete'),true);
    if(ok){await softDelete(id);renderList()}
  }
}
$('#hmore').addEventListener('click',async function(){

/* ---------- trash ---------- */
var TRASH_DAYS=30;
async function softDelete(id){
  await loadItems();
  var m=byId(id);if(!m)return;
  var now=Date.now();
  m.deleted=now;await putMeta(m);
  if(kindM(m)==='folder'){
    var kids=ITEMS.filter(function(x){return x.parent===id&&!x.deleted});
    for(var i=0;i<kids.length;i++){kids[i].deleted=now;kids[i].delWith=id;await putMeta(kids[i])}
  }
  toast(t('Moved to Trash'));
}
async function deleteForever(id){
  await loadItems();
  var m=byId(id);if(!m)return;

/* ---------- backup and restore ---------- */
function u32(n){var b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n,true);return b}
async function createBackup(){
  setBusy(t('Creating backup…'));
  try{
    await loadItems();
    var L=live(),enc=new TextEncoder(),parts=[],items=[],i;
    for(i=0;i<L.length;i++){
      var m=L[i],rec={meta:m,len:0};
      if(kindM(m)!=='folder'){var d=await getData(m.id);if(d&&d.buf){rec.len=d.buf.byteLength;parts.push(new Uint8Array(d.buf))}}
      items.push(rec);
    }
    var hdr=enc.encode(JSON.stringify({v:1,app:'research-sangrah',items:items,settings:SET})),total=8+hdr.length;
    parts.forEach(function(p){total+=p.length});
    var out=new Uint8Array(total);
    out.set(enc.encode('RSB1'),0);out.set(u32(hdr.length),4);out.set(hdr,8);
    var o=8+hdr.length;parts.forEach(function(p){out.set(p,o);o+=p.length});
    var dt=new Date(),ds=dt.getFullYear()+('0'+(dt.getMonth()+1)).slice(-2)+('0'+dt.getDate()).slice(-2);
    await saveBytes(out,'research-sangrah-backup-'+ds+'.rsb','application/octet-stream');
  }catch(e){toast(t('Backup failed')+': '+(e&&e.message||e))}
  setBusy(null);
}
var onPicker2=null;
function startRestore(){onPicker2=restoreBackup;$('#picker2').value='';$('#picker2').click()}
$('#picker2').addEventListener('change',function(){
  var f=$('#picker2').files&&$('#picker2').files[0],cb=onPicker2;onPicker2=null;
  if(f&&cb)cb(f);
});
async function restoreBackup(file){
  setBusy(t('Restoring…'));
  try{
    var buf=await file.arrayBuffer(),u8=new Uint8Array(buf);
    if(String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='RSB1')throw new Error(t('This is not a backup file'));
    var hl=new DataView(buf).getUint32(4,true),hdr=JSON.parse(new TextDecoder().decode(u8.subarray(8,8+hl))),o=8+hl,n=0;
    for(var i=0;i<hdr.items.length;i++){
      var rec=hdr.items[i],m=fix(rec.meta);delete m.deleted;delete m.delWith;
      if(rec.len>0){await addFile(m,buf.slice(o,o+rec.len));o+=rec.len}
      else if(kindM(m)==='folder'||m.kind==='grid'||m.kind==='note')await addFile(m,new ArrayBuffer(0));
      else await putMeta(m);
      n++;
    }
    await renderList();
    toast(t('Restored')+': '+n);
  }catch(e){toast(t('Restore failed')+': '+(e&&e.message||e))}
  setBusy(null);
}

/* ---------- undo / redo (snapshots) ---------- */
var UM={st:[],i:-1,get:null,set:null,tm:null};
function umInit(get,set){clearTimeout(UM.tm);UM={st:[get()],i:0,get:get,set:set,tm:null};updUndo()}
function umReset(){clearTimeout(UM.tm);UM={st:[],i:-1,get:null,set:null,tm:null};updUndo()}
function umCommit(now){
  clearTimeout(UM.tm);
  if(!UM.get)return;
  var f=function(){
    if(!UM.get)return;
    var s=UM.get();
    if(s===UM.st[UM.i])return;
    UM.st=UM.st.slice(0,UM.i+1);UM.st.push(s);
    if(UM.st.length>50)UM.st.shift();
    UM.i=UM.st.length-1;updUndo();
  };
  if(now)f();else UM.tm=setTimeout(f,600);
}
function umUndo(){umCommit(true);if(UM.set&&UM.i>0){UM.i--;UM.set(UM.st[UM.i]);updUndo();scheduleSave()}}
function umRedo(){if(UM.set&&UM.i<UM.st.length-1){UM.i++;UM.set(UM.st[UM.i]);updUndo();scheduleSave()}}
function updUndo(){$('#bUndo').disabled=!(UM.i>0);$('#bRedo').disabled=!(UM.i>=0&&UM.i<UM.st.length-1)}

/* ---------- jump to a searched word ---------- */
function jumpTo(term){
  term=String(term||'').trim();
  if(!term||!cur)return;
  var tl=term.toLowerCase();
  function find(){
    var w=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,null),n,i;
    while((n=w.nextNode())){
      i=n.nodeValue.toLowerCase().indexOf(tl);
      if(i>-1){var r=document.createRange();r.setStart(n,i);r.setEnd(n,i+term.length);return r}
    }
    return null;
  }
  var r=find();
  if(!r&&kindM(cur)==='sheet'&&wb){
    var keep=curSheet;
    for(var i=0;i<wb.SheetNames.length&&!r;i++){if(i===keep)continue;pickSheet(i);r=find()}
    if(!r)pickSheet(keep);
  }
  if(!r)return;
  var el=r.startContainer.parentElement;
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',inline:'center'});
  setTimeout(function(){
    var rs=r.getClientRects();
    for(var j=0;j<rs.length;j++){
      var f=document.createElement('div');f.className='flash';
      f.style.cssText='left:'+rs[j].left+'px;top:'+rs[j].top+'px;width:'+rs[j].width+'px;height:'+rs[j].height+'px';
      document.body.appendChild(f);setTimeout(function(x){return function(){x.remove()}}(f),2300);
    }
  },160);
}

/* ---------- two-finger pinch zoom ---------- */
var pz={on:false};
function dist(tt){var dx=tt[0].clientX-tt[1].clientX,dy=tt[0].clientY-tt[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
function isPdf(){return cur&&kindM(cur)==='pdf'}
function applyPinch(){
  if(!pz.on)return;
  pz.raf=0;
  if(isPdf()){
    var w=content.firstChild;
    if(w&&w.style){w.style.transformOrigin=(pz.sl+pz.mx)+'px '+pz.y+'px';w.style.transform='scale('+pz.r+')'}
  }else{
    content.style.setProperty('--z',pz.z0*pz.r);
    main.scrollLeft=(pz.sl+pz.mx)*pz.r-pz.mx;
    main.scrollTop=pz.h+pz.y*pz.r-pz.my;
  }
}
main.addEventListener('touchstart',function(e){
  if(e.touches.length!==2||!cur)return;
  var rc=main.getBoundingClientRect(),tt=e.touches,h=content.offsetTop;
  var my=(tt[0].clientY+tt[1].clientY)/2-rc.top;
  pz={on:true,d0:dist(tt),z0:isPdf()?pdfZoom:zoom,r:1,raf:0,h:h,
      mx:(tt[0].clientX+tt[1].clientX)/2-rc.left,my:my,
      sl:main.scrollLeft,st:main.scrollTop,y:Math.max(0,main.scrollTop+my-h)};
},{passive:true});
main.addEventListener('touchmove',function(e){
  if(!pz.on||e.touches.length!==2)return;
  var z=Math.max(0.5,Math.min(isPdf()?4:3.5,pz.z0*dist(e.touches)/pz.d0));
  pz.r=z/pz.z0;
  if(!pz.raf)pz.raf=requestAnimationFrame(applyPinch);
},{passive:true});
function endPinch(e){
  if(!pz.on||e.touches.length>=2)return;
  var p=pz;pz={on:false};
  if(p.raf)cancelAnimationFrame(p.raf);
  var z=p.z0*p.r;
  if(isPdf()){
    var w=content.firstChild;if(w&&w.style)w.style.transform='';
    if(Math.abs(p.r-1)>0.02){pdfZoom=z;renderPdf({r:p.r,mx:p.mx,my:p.my,sl:p.sl,h:p.h,y:p.y})}
  }else{
    zoom=z;content.style.setProperty('--z',z);
    main.scrollLeft=(p.sl+p.mx)*p.r-p.mx;main.scrollTop=p.h+p.y*p.r-p.my;
  }
}
main.addEventListener('touchend',endPinch,{passive:true});
main.addEventListener('touchcancel',endPinch,{passive:true});

function nonEmpty(c){

function cellText(c){return c?(c.w!==undefined?c.w:(c.v!==undefined?String(c.v):'')):''}
function cellHtml(txt,target){

function readWb(buf,m){

    var txt=new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/,'');
    return XLSX.read(txt,e==='tsv'?{type:'string',FS:'\t'}:{type:'string'});
  }
  return XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
}
function edCell(key,txt){
  return '<td class="ed"><div class="v" contenteditable="plaintext-only" data-k="'+key+'">'+esc(txt||'')+'</div><div class="chips">'+chipsHtml(txt||'')+'</div></td>';

function edHead(key,txt,ph){

function focusEnd(v){

function buildSheet(i){
  var name=wb.SheetNames[i],ws=wb.Sheets[name],ed=getEdits(name);
  if(!ws||!ws['!ref'])return {title:'',html:'<p class="muted">'+t('This tab is empty.')+'</p>'};
  var r=XLSX.utils.decode_range(ws['!ref']);
  function cell(R,C){return ws[XLSX.utils.encode_cell({r:R,c:C})]}
  function rb(R){var s=ed.st[R]||'';return '<td class="rh"><button class="rb st-'+s+'" data-r="'+R+'" aria-label="Mark">'+stSym(s)+'</button></td>'}
  var R,C,k,j;
  var hdr=r.s.r,lim=Math.min(r.e.r,r.s.r+15);
  for(R=r.s.r;R<=lim;R++){
    var n=0;for(C=r.s.c;C<=r.e.c;C++)if(nonEmpty(cell(R,C)))n++;
    if(n>=2){hdr=R;break}
  }
  var title='';
  for(R=r.s.r;R<hdr&&!title;R++){
    for(C=r.s.c;C<=r.e.c;C++){if(nonEmpty(cell(R,C))){title=cellText(cell(R,C));break}}
  }
  var wr={};
  for(C=r.s.c;C<=r.e.c;C++){
    if(!nonEmpty(cell(hdr,C))||r.e.r<=hdr)continue;
    var all=true;
    for(R=hdr+1;R<=r.e.r;R++){if(nonEmpty(cell(R,C))){all=false;break}}
    if(all)wr[C]=1;
  }
  var hlen=0;for(C=r.s.c;C<=r.e.c;C++)hlen+=cellText(cell(hdr,C)).length;
  var headerShort=hlen<=260;
  var skip={},span={};
  (ws['!merges']||[]).forEach(function(g){
    span[g.s.r+','+g.s.c]=[g.e.r-g.s.r+1,g.e.c-g.s.c+1];
    for(var a=g.s.r;a<=g.e.r;a++)for(var b=g.s.c;b<=g.e.c;b++)if(a!==g.s.r||b!==g.s.c)skip[a+','+b]=1;
  });
  var rows=ws['!rows']||[],maxR=Math.min(r.e.r,hdr+4999),out=['<table>'];
  for(R=hdr;R<=maxR;R++){
    if(rows[R]&&rows[R].hidden)continue;
    var isH=(R===hdr);
    out.push(isH&&headerShort?'<tr class="hrow"><th class="rh"></th>':'<tr>'+(isH?'<td class="rh"></td>':rb(R)));
    for(C=r.s.c;C<=r.e.c;C++){
      k=R+','+C;if(skip[k])continue;
      if(!isH&&wr[C]){out.push(edCell(k,ed.cells[k]));continue}
      var c=cell(R,C),sp=span[k],at=sp?' rowspan="'+sp[0]+'" colspan="'+sp[1]+'"':'',tg=(isH&&headerShort)?'th':'td';
      out.push('<'+tg+at+'>'+cellHtml(cellText(c),c&&c.l&&c.l.Target)+'</'+tg+'>');
    }
    for(j=0;j<ed.addCols;j++){
      k=R+','+(r.e.c+1+j);
      out.push(isH?edHead(k,ed.cells[k],t('Column name')):edCell(k,ed.cells[k]));
    }
    out.push(isH?'<th class="plus"><button class="addc" aria-label="Add column">+</button></th>':'<td class="plus"></td>');
    out.push('</tr>');
  }
  for(var a=0;a<ed.addRows;a++){
    R=r.e.r+1+a;
    out.push('<tr>'+rb(R));
    for(C=r.s.c;C<=r.e.c+ed.addCols;C++){k=R+','+C;out.push(edCell(k,ed.cells[k]))}
    out.push('<td class="plus"></td></tr>');
  }
  out.push('</table><div class="addr"><button class="addr-btn">+ '+t('Add row')+'</button></div>');
  return {title:title,html:out.join('')};
}

function newGridData(){
  var g={sub:'',head:DEF_HEAD.slice(),rows:[],cid:[],rid:[],fmt:{},st:{}},i;
  g.head.forEach(function(){g.cid.push(newId())});
  for(i=1;i<=5;i++){g.rows.push([String(i),'','','']);g.rid.push(newId())}
  return g;
}
function ensureGrid(m){
  var g=m.grid;if(!g)g=m.grid=newGridData();
  if(!g.cid||g.cid.length!==g.head.length){g.cid=g.head.map(function(){return newId()})}
  if(!g.rid||g.rid.length!==g.rows.length){g.rid=g.rows.map(function(){return newId()})}
  if(!g.fmt)g.fmt={};if(!g.st)g.st={};
  return g;
}
function gridText(g){return [g.sub||''].concat(g.head,[].concat.apply([],g.rows)).join(' ')}
function gridEmpty(m){
  var g=m.grid;if(!g)return false;
  return !(g.sub||'').trim()&&g.head.join('|')===DEF_HEAD.join('|')&&g.rows.every(function(r){return r.slice(1).every(function(c){return !String(c).trim()})});

async function gridRowMenu(r){

  }else if(a==='down'&&r<g.rows.length-1){

async function gridColMenu(c){

    {k:'left',label:t('Move left')},{k:'right',label:t('Move right')},{k:'del',label:t('Delete column'),cls:'danger'}]);

  umCommit(true);
  function swap(arr,i,j){var x=arr[i];arr[i]=arr[j];arr[j]=x}
  if(a==='left'&&c>0){swap(g.head,c,c-1);swap(g.cid,c,c-1);g.rows.forEach(function(r){swap(r,c,c-1)})}
  else if(a==='right'&&c<g.head.length-1){swap(g.head,c,c+1);swap(g.cid,c,c+1);g.rows.forEach(function(r){swap(r,c,c+1)})}
  else if(a==='del'){

/* ================= notes: rich text for long scripts ================= */
function textToHtml(s){
  return String(s).replace(/\r\n?/g,'\n').split('\n').map(function(l){return '<div>'+(l?esc(l):'<br>')+'</div>'}).join('');
}
var OKTAG={DIV:1,P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,SPAN:1,FONT:1,UL:1,OL:1,LI:1,H1:1,H2:1,H3:1,MARK:1,BLOCKQUOTE:1};
function copyStyle(from,to){
  var s=from.style;if(!s)return;
  if(s.color)to.style.color=s.color;
  if(s.backgroundColor)to.style.backgroundColor=s.backgroundColor;
  var fs=s.fontSize;
  if(fs&&(/^calc\(/.test(fs)||/^[\d.]+(px|pt|em|%)$/.test(fs)))to.style.fontSize=fs;
  if(s.fontWeight)to.style.fontWeight=s.fontWeight;
  if(s.fontStyle)to.style.fontStyle=s.fontStyle;
  if(s.textDecorationLine||s.textDecoration)to.style.textDecoration=s.textDecorationLine||s.textDecoration;
  if(s.textAlign)to.style.textAlign=s.textAlign;
}
function sanitizeHtml(html){
  var doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),root=document.createElement('div');
  function walk(n,out){
    for(var c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3){out.appendChild(document.createTextNode(c.nodeValue))}
      else if(c.nodeType===1){
        var tg=c.tagName;
        if(OKTAG[tg]){
          var e=document.createElement(tg==='FONT'?'span':tg);
          copyStyle(c,e);
          if(tg==='FONT'&&c.getAttribute('color'))e.style.color=c.getAttribute('color');
          if(c.getAttribute('align'))e.style.textAlign=c.getAttribute('align');
          walk(c,e);out.appendChild(e);
        }else if(!/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(tg)){walk(c,out)}
      }
    }
  }
  walk(doc.body,root);
  return root.innerHTML;
}
/* plain text of the editor, one line per paragraph */
function nodeText(root){
  var out=[],buf='';
  function flush(){out.push(buf);buf=''}
  function walk(n){
    for(var c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3){buf+=c.nodeValue}
      else if(c.nodeType===1){
        var tg=c.tagName;
        if(tg==='BR'){flush();continue}
        var blk=/^(DIV|P|LI|H1|H2|H3|UL|OL|BLOCKQUOTE)$/.test(tg);
        if(blk&&buf!=='')flush();
        walk(c);
        if(blk&&buf!=='')flush();
      }
    }
  }
  walk(root);if(buf!=='')flush();
  return out.join('\n');
}
function fmtDur(min){
  var h=Math.floor(min/60),m=Math.round(min%60);
  if(h>0)return h+' '+t('h')+' '+m+' '+t('min');
  return Math.max(1,Math.round(min))+' '+t('min');
}
var noteFlush=null,nTm=null;
function updCount(){
  var el=$('#ntCount');if(!el||!cur)return;
  var w=cur.words||0,ch=(cur.text||'').length;
  el.textContent=w.toLocaleString('en-US')+' '+t('words')+' · '+ch.toLocaleString('en-US')+' '+t('characters')+(w>0?' · ≈ '+fmtDur(w/SET.wpm)+' '+t('speaking time'):'');
}
function commitNote(){
  clearTimeout(nTm);
  var ed=$('#ntEd');if(!ed||!cur||kindM(cur)!=='note')return;
  if(ed.firstChild&&ed.textContent===''&&!ed.querySelector('li,img'))ed.innerHTML='';
  cur.html=ed.innerHTML;cur.text=nodeText(ed);cur.words=words(cur.text);cur.size=cur.text.length;
  updCount();scheduleSave();
}
function onNoteInput(){
  fixFonts();
  clearTimeout(nTm);nTm=setTimeout(commitNote,450);
  umCommit(false);
}
var pendingSize=0;
function fixFonts(){
  var ed=$('#ntEd');if(!ed)return;
  var list=ed.querySelectorAll('font[size],span[style*="xxx-large"]');
  Array.prototype.forEach.call(list,function(f){
    var sp=f;
    if(f.tagName==='FONT'){sp=document.createElement('span');while(f.firstChild)sp.appendChild(f.firstChild);f.parentNode.replaceChild(sp,f)}
    sp.style.fontSize='calc('+(pendingSize||18)+'px*var(--z)*var(--fs))';
  });
}
function onNotePaste(e){
  e.preventDefault();
  var txt=(e.clipboardData||window.clipboardData).getData('text/plain');
  if(!txt)return;
  insertPlain(txt);
}
/* big pastes are inserted as ready-made paragraphs, which is much faster than typing them in */
function insertPlain(txt){
  var ed=$('#ntEd');if(!ed)return;
  ed.focus();
  txt=txt.replace(/\r\n?/g,'\n');
  var sel=window.getSelection();
  if(txt.length<3000||!sel.rangeCount){document.execCommand('insertText',false,txt);onNoteInput();return}
  var r=sel.getRangeAt(0);r.deleteContents();
  var lines=txt.split('\n'),frag=document.createDocumentFragment(),i;
  var blk=r.startContainer;
  while(blk&&blk.parentNode!==ed&&blk!==ed)blk=blk.parentNode;
  if(!blk||blk===ed){
    for(i=0;i<lines.length;i++){var d0=document.createElement('div');if(lines[i])d0.textContent=lines[i];else d0.appendChild(document.createElement('br'));frag.appendChild(d0)}
    r.insertNode(frag);
  }else{
    var tail=document.createRange();tail.setStart(r.startContainer,r.startOffset);
    if(blk.lastChild)tail.setEndAfter(blk.lastChild);else tail.setEnd(blk,0);
    var tailFrag=tail.extractContents();
    if(blk.childNodes.length===1&&blk.firstChild.nodeName==='BR')blk.removeChild(blk.firstChild);
    if(lines[0])blk.appendChild(document.createTextNode(lines[0]));
    var last=blk;
    for(i=1;i<lines.length;i++){
      var d=document.createElement('div');
      if(lines[i])d.textContent=lines[i];
      last.parentNode.insertBefore(d,last.nextSibling);last=d;
    }
    var hasTail=tailFrag.textContent!=='';
    if(hasTail){last.appendChild(tailFrag)}
    else if(!last.firstChild)last.appendChild(document.createElement('br'));
    if(!blk.firstChild)blk.appendChild(document.createElement('br'));
    try{var nr=document.createRange();nr.selectNodeContents(last);nr.collapse(!hasTail);sel.removeAllRanges();sel.addRange(nr)}catch(e2){}
  }
  onNoteInput();
}
async function showNote(buf,m){
  content.classList.add('note');
  content.innerHTML='<div class="nt"><input id="ntTitle" type="text" maxlength="120" placeholder="'+esc(t('Title'))+'"><div id="ntEd" contenteditable="true" spellcheck="false" data-ph="'+esc(t('Write or paste your script or notes here…'))+'"></div><div id="ntCount"></div></div>';
  var ed=$('#ntEd'),ti=$('#ntTitle');
  var html=m.html;if(!html&&m.text)html=textToHtml(m.text);
  ed.innerHTML=sanitizeHtml(html||'');
  ti.value=m.name==='Untitled note'?'':m.name;
  try{document.execCommand('defaultParagraphSeparator',false,'div');document.execCommand('styleWithCSS',false,true)}catch(e){}
  if(m.text===undefined||m.words===undefined){m.text=nodeText(ed);m.words=words(m.text)}
  updCount();
  ed.addEventListener('input',onNoteInput);
  ed.addEventListener('paste',onNotePaste);
  ti.addEventListener('input',function(){cur.name=ti.value.trim()||'Untitled note';$('#vtitle').textContent=cur.name;scheduleSave()});
  ti.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();ed.focus()}});
  noteFlush=commitNote;

  umInit(function(){return ed.innerHTML},function(s){
    ed.innerHTML=s;commitNote();
    try{var r=document.createRange();r.selectNodeContents(ed);r.collapse(false);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(r)}catch(e2){}
  });

/* ---------- formatting ---------- */
function ex(cmd,val){
  var ed=$('#ntEd');if(!ed)return;
  ed.focus();
  document.execCommand(cmd,false,val===undefined?null:val);
  onNoteInput();
}
function saveRange(){var s=window.getSelection();return s.rangeCount?s.getRangeAt(0).cloneRange():null}
function restoreRange(r){
  var ed=$('#ntEd');if(!ed)return;
  ed.focus();
  if(r){var s=window.getSelection();s.removeAllRanges();s.addRange(r)}
}
function sizeStep(d){
  var ed=$('#ntEd');ed.focus();
  var s=window.getSelection();if(!s.rangeCount)return;
  var node=s.anchorNode,el=node&&(node.nodeType===1?node:node.parentElement);
  var scale=parseFloat(getComputedStyle(ed).fontSize)/16||1;
  var curPx=(el?parseFloat(getComputedStyle(el).fontSize):16)/scale;
  pendingSize=Math.max(10,Math.min(64,Math.round(curPx+d)));
  document.execCommand('fontSize',false,'7');
  fixFonts();onNoteInput();
}
async function noteFmt(c){
  var ed=$('#ntEd');if(!ed)return;
  if(c==='b')ex('bold');
  else if(c==='i')ex('italic');
  else if(c==='u')ex('underline');
  else if(c==='ul')ex('insertUnorderedList');
  else if(c==='ol')ex('insertOrderedList');
  else if(c==='head'){ed.focus();var v=(document.queryCommandValue('formatBlock')||'').toLowerCase();ex('formatBlock',v==='h2'?'div':'h2')}
  else if(c==='align'){
    ed.focus();
    if(document.queryCommandState('justifyCenter'))ex('justifyRight');
    else if(document.queryCommandState('justifyRight'))ex('justifyLeft');
    else ex('justifyCenter');
  }
  else if(c==='szup')sizeStep(2);
  else if(c==='szdn')sizeStep(-2);
  else if(c==='col'||c==='hl'){
    var r=saveRange();
    var v2=await askColor(c==='col'?t('Text colour'):t('Highlight'),c==='col'?t('Clear formatting'):t('Remove highlight'));
    restoreRange(r);
    if(v2===null)return;
    if(c==='col'){if(v2==='__none')ex('removeFormat');else ex('foreColor',v2)}
    else ex('hiliteColor',v2==='__none'?'transparent':v2);
  }
  else if(c==='totable')noteToTable();
}

/* ---------- find and replace ---------- */
var findOpen=false,fMatches=[],fIdx=-1;
function openFind(){
  if(!cur||kindM(cur)!=='note')return;
  findOpen=true;$('#nfind').classList.remove('hidden');$('#fq').focus();fSearch(false);
}
function closeFind(){findOpen=false;$('#nfind').classList.add('hidden')}
function closeFindUi(){closeFind();$('#nplay').classList.add('hidden')}
function fSearch(jump){
  var ed=$('#ntEd'),q=$('#fq').value.toLowerCase();
  fMatches=[];fIdx=-1;
  if(ed&&q){
    var w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT,null),n,i,v;
    while((n=w.nextNode())){
      v=n.nodeValue.toLowerCase();i=v.indexOf(q);
      while(i>-1){fMatches.push({n:n,s:i,e:i+q.length});i=v.indexOf(q,i+q.length)}
    }
  }
  $('#fcount').textContent=q?(fMatches.length+' '+t('matches')):'';
  if(jump&&fMatches.length){fIdx=0;fShow()}
}
function fShow(){
  var m=fMatches[fIdx];if(!m)return;
  var r=document.createRange();r.setStart(m.n,m.s);r.setEnd(m.n,m.e);
  var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  if(m.n.parentElement)m.n.parentElement.scrollIntoView({block:'center'});
  $('#fcount').textContent=(fIdx+1)+' / '+fMatches.length;
}
function fStep(d){
  if(!fMatches.length){fSearch(true);return}
  fIdx=(fIdx+d+fMatches.length)%fMatches.length;fShow();
}
$('#fq').addEventListener('input',function(){fSearch(true)});
$('#fq').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();fStep(1)}});
$('#fnext').addEventListener('click',function(){fStep(1)});
$('#fprev').addEventListener('click',function(){fStep(-1)});
$('#fclose').addEventListener('click',closeFind);
$('#frep').addEventListener('click',function(){
  if(fIdx<0||!fMatches[fIdx]){fStep(1);return}
  var m=fMatches[fIdx],r=document.createRange();
  r.setStart(m.n,m.s);r.setEnd(m.n,m.e);r.deleteContents();
  r.insertNode(document.createTextNode($('#fr').value));
  $('#ntEd').normalize();
  var keep=fIdx;commitNote();umCommit(true);
  fSearch(false);fIdx=Math.min(keep,fMatches.length-1);
  if(fIdx>=0)fShow();else $('#fcount').textContent='0 '+t('matches');
});
$('#frepall').addEventListener('click',function(){
  if(!fMatches.length){fSearch(false)}
  var list=fMatches.slice(),rep=$('#fr').value,i;
  for(i=list.length-1;i>=0;i--){
    var m=list[i],r=document.createRange();
    r.setStart(m.n,m.s);r.setEnd(m.n,m.e);r.deleteContents();r.insertNode(document.createTextNode(rep));
  }
  $('#ntEd').normalize();commitNote();umCommit(true);
  fSearch(false);
  toast(list.length+' '+t('replaced'));
});

/* ---------- read aloud ---------- */
var spTok=0,spQ=[],spI=0,spPaused=false;
function chunkText(s){
  var out=[];
  s.split(/\n+/).forEach(function(p){
    p=p.trim();if(!p)return;
    var parts=p.split(/(?<=[.!?।])\s+/),buf='';
    parts.forEach(function(x){
      if((buf+' '+x).length>220&&buf){out.push(buf);buf=x}else buf=buf?buf+' '+x:x;
    });
    if(buf)out.push(buf);
  });
  return out;
}
function stopSpeech(){
  spTok++;spQ=[];spI=0;spPaused=false;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}
  var p=$('#nplay');if(p)p.classList.add('hidden');
}
function speakNext(){
  var tok=spTok;
  if(spI>=spQ.length){stopSpeech();return}
  $('#nplayMsg').textContent=t('Reading…')+' '+(spI+1)+' / '+spQ.length;
  var u=new SpeechSynthesisUtterance(spQ[spI]);
  u.lang=SET.tts;
  u.onend=function(){if(tok!==spTok||spPaused)return;spI++;speakNext()};
  u.onerror=function(){if(tok!==spTok||spPaused)return;spI++;speakNext()};
  try{window.speechSynthesis.speak(u)}catch(e){stopSpeech();toast(t('Read aloud is not available on this phone'))}
}
function readAloud(){
  if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){toast(t('Read aloud is not available on this phone'));return}
  commitNote();
  var sel=(window.getSelection()||'').toString().trim();
  var text=sel||cur.text||'';
  if(!text.trim()){toast(t('Nothing to read yet'));return}
  stopSpeech();
  try{
    var vs=window.speechSynthesis.getVoices(),pre=SET.tts.slice(0,2);
    if(vs.length&&!vs.some(function(v){return v.lang&&v.lang.toLowerCase().indexOf(pre)===0}))toast(t('No voice for this language was found. Install it in the phone text-to-speech settings.'));
  }catch(e){}
  spQ=chunkText(text);spI=0;spPaused=false;
  $('#nplay').classList.remove('hidden');$('#nplayPause').textContent='❚❚';
  speakNext();
}
$('#nplayPause').addEventListener('click',function(){
  if(!spQ.length)return;
  if(!spPaused){spPaused=true;spTok++;try{window.speechSynthesis.cancel()}catch(e){}$('#nplayPause').textContent='▶'}
  else{spPaused=false;$('#nplayPause').textContent='❚❚';speakNext()}
});
$('#nplayStop').addEventListener('click',stopSpeech);

/* ---------- note -> table ---------- */
function addRowToGrid(m,info){
  var g=ensureGrid(m),n=g.head.length,i;
  function idxOf(re,def){for(var j=0;j<n;j++)if(re.test(g.head[j]))return j;return def}
  var sIdx=idxOf(/statement|कथन|point|claim/i,n>1?1:0);
  var lIdx=idxOf(/link|लिंक|url/i,n-1);
  var oIdx=idxOf(/source|स्रोत|सोर्स/i,-1);
  var stmt=String(info.statement||'').trim(),link=info.link||'';
  if(!link){var us=urlsIn(stmt);if(us.length){link=us[0];stmt=stmt.split(link).join(' ').replace(/\s+/g,' ').trim()}}
  var row=null,ri=-1;
  for(i=0;i<g.rows.length;i++){
    if(g.rows[i].every(function(v,c){return c===0||!String(v).trim()})){row=g.rows[i];ri=i;break}
  }
  if(!row){
    row=[];for(i=0;i<n;i++)row.push('');
    var last=g.rows[g.rows.length-1];
    if(last&&/^\d+$/.test(String(last[0]||'').trim()))row[0]=String(+String(last[0]).trim()+1);
    g.rows.push(row);g.rid.push(newId());ri=g.rows.length-1;
  }
  row[sIdx]=stmt;
  if(link&&lIdx!==sIdx)row[lIdx]=link;
  if(info.source&&oIdx>-1)row[oIdx]=info.source;
  m.text=gridText(g);
  return ri;
}
async function chooseTable(parent,title){
  await loadItems();
  var grids=live().filter(function(g){return kindM(g)==='grid'}).sort(function(a,b){
    var ap=(a.parent===parent)?1:0,bp=(b.parent===parent)?1:0;return(bp-ap)||sortFn(a,b);
  });
  var opts=[{k:'__new',label:'＋ '+t('New table')}].concat(grids.slice(0,30).map(function(g){
    var pf=g.parent?byId(g.parent):null;
    return {k:g.id,label:'📋 '+g.name,sub:pf?pf.name:''};
  }));
  var r=await askSheet(title||t('Add to which table?'),opts);
  if(!r)return null;
  var target;
  if(r==='__new'){
    target=await createGrid({silent:true,parent:parent});
    target.name=t('Research table');
  }else{target=await getMeta(r);if(!target)return null;fix(target)}
  return target;
}
async function noteToTable(){
  var s=window.getSelection(),txt=s?s.toString().trim():'';
  if(!txt){toast(t('Select some text in the note first'));return}
  var target=await chooseTable(cur.parent);
  if(!target)return;
  var ri=addRowToGrid(target,{statement:txt});
  await putMeta(target);
  toast(t('Added to')+' '+target.name+' ('+t('row')+' '+(ri+1)+')');
}

/* ================= uploaded PDFs: reading, marking up, page tools ================= */
var pdfDoc=null,pdfZoom=1,pdfObs=null,pdfTok=0,annMode=false,annTool=null,annStroke=null;
var ANN_COL={h:'#ffeb3b',p:'#e53935',t:'#111111'};
async function showPdf(buf,m){
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
  pdfZoom=1;annMode=false;annTool=null;
  if(!cur.ann)cur.ann={};
  await renderPdf(null);
}
async function renderPdf(anchor){
  var tok=++pdfTok,doc=pdfDoc;
  var baseW=Math.max(240,Math.min(main.clientWidth||window.innerWidth,900)-8);
  var wrap=document.createElement('div');wrap.className='pdfwrap';
  var boxes=[],dpr=Math.min(window.devicePixelRatio||1,2);
  for(var p=1;p<=doc.numPages;p++){
    var page=await doc.getPage(p);
    if(tok!==pdfTok)return;
    var v0=page.getViewport({scale:1}),vp=page.getViewport({scale:baseW*pdfZoom/v0.width});
    var box=document.createElement('div');box.className='pg';
    box.style.width=vp.width+'px';box.style.height=vp.height+'px';
    box._page=page;box._vp=vp;box._i=p-1;
    var ov=document.createElement('canvas');ov.className='pann'+(annMode&&annTool?' on':'');
    ov.width=Math.round(vp.width*dpr);ov.height=Math.round(vp.height*dpr);
    ov.style.width=vp.width+'px';ov.style.height=vp.height+'px';
    box._ov=ov;box.appendChild(ov);
    wrap.appendChild(box);boxes.push(box);
  }
  if(tok!==pdfTok)return;
  if(pdfObs)pdfObs.disconnect();
  content.replaceChildren(wrap);
  if(anchor){
    main.scrollLeft=(anchor.sl+anchor.mx)*anchor.r-anchor.mx;
    main.scrollTop=anchor.h+anchor.y*anchor.r-anchor.my;
  }
  pdfObs=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting&&!en.target._done){en.target._done=true;drawPage(en.target)}});
  },{root:main,rootMargin:'900px 0px'});
  boxes.forEach(function(b){pdfObs.observe(b);drawAnn(b)});
}
async function drawPage(box){
  var page=box._page,vp=box._vp,dpr=pdfZoom>1?1:Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement('canvas');
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  box.insertBefore(cv,box._ov);
  try{
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:undefined}).promise;
    var ann=await page.getAnnotations({intent:'display'});
    ann.forEach(function(a){
      if(a.subtype!=='Link'||!a.url)return;
      var q=vp.convertToViewportRectangle(a.rect),l=document.createElement('a');
      l.href=a.url;l.className='pdflink';
      l.style.left=Math.min(q[0],q[2])+'px';l.style.top=Math.min(q[1],q[3])+'px';
      l.style.width=Math.abs(q[2]-q[0])+'px';l.style.height=Math.abs(q[3]-q[1])+'px';
      box.insertBefore(l,box._ov);
    });
  }catch(e){}
}
async function pdfPlainText(buf,maxPages){
  var doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,out=[];
  var n=Math.min(doc.numPages,maxPages||doc.numPages);
  for(var p=1;p<=n;p++){
    var pg=await doc.getPage(p),tc=await pg.getTextContent(),line='',lastY=null;
    tc.items.forEach(function(it){
      var y=it.transform?it.transform[5]:0;
      if(lastY!==null&&Math.abs(y-lastY)>2){out.push(line.trim());line=''}
      line+=it.str+(it.str&&!/\s$/.test(it.str)?' ':'');lastY=y;
    });
    if(line.trim())out.push(line.trim());
    out.push('');
  }
  try{doc.destroy()}catch(e){}
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- marking up ---------- */
function paintAnn(ctx,a,W,H){
  if(a.t==='h'){ctx.globalAlpha=0.38;ctx.fillStyle=a.c;ctx.fillRect(a.x*W,a.y*H,a.w*W,a.h*H);ctx.globalAlpha=1}
  else if(a.t==='p'){
    ctx.strokeStyle=a.c;ctx.lineWidth=a.w*W;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    a.pts.forEach(function(p,i){var x=p[0]*W,y=p[1]*H;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
    if(a.pts.length===1)ctx.lineTo(a.pts[0][0]*W+0.1,a.pts[0][1]*H);
    ctx.stroke();
  }else if(a.t==='t'){
    var px=a.sz*W;ctx.fillStyle=a.c;ctx.font=px+'px "Noto Sans Devanagari",system-ui,sans-serif';ctx.textBaseline='top';
    a.s.split('\n').forEach(function(l,i){ctx.fillText(l,a.x*W,a.y*H+i*px*1.25)});
  }

var DPI=150,SC=DPI/72;
var PFONT='"Noto Sans Devanagari","Noto Sans","Roboto",system-ui,sans-serif';

/* ---------- colours ---------- */
var NAMED={black:'#000000',white:'#ffffff',red:'#ff0000',green:'#008000',blue:'#0000ff',yellow:'#ffff00',orange:'#ffa500',purple:'#800080',gray:'#808080',grey:'#808080'};
function normColor(c){
  if(!c)return null;c=String(c).trim().toLowerCase();
  if(c==='transparent'||c==='inherit'||c==='initial')return null;
  if(NAMED[c])return NAMED[c];
  var m=c.match(/^#([0-9a-f]{3})$/);
  if(m)return '#'+m[1].split('').map(function(x){return x+x}).join('');
  if(/^#[0-9a-f]{6}$/.test(c))return c;
  m=c.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s/]+([\d.]+))?/);
  if(m){
    if(m[4]!==undefined&&+m[4]===0)return null;
    return '#'+[m[1],m[2],m[3]].map(function(x){return('0'+Math.min(255,+x).toString(16)).slice(-2)}).join('');
  }
  return null;
}
function rgbOf(hex){

var PF={ready:null,reg:null,bold:null};
function mkFont(FK,bytes){var fk=FK.create(bytes);return {fk:fk,bytes:bytes,upm:fk.unitsPerEm||1000,cache:{},used:{}}}
function loadPdfFonts(){

    var FK=window.fontkit&&(window.fontkit.create?window.fontkit:window.fontkit.default);
    if(!FK)return false;

    try{var b=await fetch('lib/font-bold.ttf');if(b.ok)bb=new Uint8Array(await b.arrayBuffer())}catch(e){}
    PF.reg=mkFont(FK,rb);PF.bold=bb===rb?PF.reg:mkFont(FK,bb);

function isDeva(c){return(c>=0x900&&c<=0x97F)||c===0x200C||c===0x200D||(c>=0xA8E0&&c<=0xA8FF)}

/* ---------- wrapping styled text into lines ---------- */
function wrapRuns(runs,maxW){
  var words=[],sp=false;
  runs.forEach(function(r){
    String(r.s).split(/( +)/).forEach(function(p){
      if(p==='')return;

      words.push({s:p,st:r.st,sp:sp&&words.length>0});sp=false;
    });
  });
  var units=[];
  words.forEach(function(w){
    if(w.sp||!units.length)units.push({pieces:[w],sp:w.sp});else units[units.length-1].pieces.push(w);
  });

  function push(){lines.push(line);line={items:[],w:0,hpt:0};x=0}
  function add(s,st,w,url,gap){
    line.items.push({s:s,st:st,x:x+gap,w:w,u:url});x+=gap+w;line.w=x;line.hpt=Math.max(line.hpt,st.pt);
  }

    var ws=u.pieces.map(function(p){return mw(p.s,p.st)}),uw=0,k;
    ws.forEach(function(v){uw+=v});
    var gap=(line.items.length&&u.sp)?mw(' ',u.pieces[0].st):0;
    if(line.items.length&&x+gap+uw>maxW){push();gap=0}
    if(uw<=maxW-x-gap||(!line.items.length&&uw<=maxW)){
      for(k=0;k<u.pieces.length;k++){
        var pc=u.pieces[k],url=/^https?:\/\//i.test(pc.s)?pc.s.replace(/[.,;:!?)\]]+$/,''):null;
        add(pc.s,pc.st,ws[k],url,k===0?gap:0);

    }

    for(k=0;k<u.pieces.length;k++){
      var pc2=u.pieces[k],url2=/^https?:\/\//i.test(pc2.s)?pc2.s.replace(/[.,;:!?)\]]+$/,''):null,buf='',bw=0,g2=k===0?gap:0;
      graphemes(pc2.s).forEach(function(g){

        if(buf&&x+g2+w2>maxW){add(buf,pc2.st,bw,url2,g2);push();g2=0;buf=g;bw=mw(g,pc2.st)}
        else{buf+=g;bw=w2}

function Doc(){this.pages=[]}
Doc.prototype.page=function(land){

function putLine(p,line,x0,y,lh,boxW,align){
  var off=0;

  var base=y+(lh-line.hpt*SC)/2+line.hpt*SC*0.8;

function layoutRichBlock(doc,b){

    var ns=Object.assign({},st),s=el.style;

    if(s.backgroundColor)ns.bg=normColor(s.backgroundColor);
    var fs=s.fontSize;
    if(fs){
      var m=fs.match(/calc\(\s*([\d.]+)px/);

        if(tg==='U')ns.u=true;
        if(tg==='H1'){ns.pt=20;ns.b=true}
        if(tg==='H2'){ns.pt=16;ns.b=true}
        if(tg==='H3'){ns.pt=14;ns.b=true}
        if(tg==='BR'){if(!cur)newPara();cur=null;continue}
        if(tg==='UL'||tg==='OL'){lists.push({t:tg==='OL'?'ol':'ul',n:0});cur=null;walk(c,ns);lists.pop();cur=null;continue}
        if(tg==='LI'){
          var L=lists[lists.length-1]||{t:'ul',n:0};L.n++;
          cur=null;newPara({list:L.t,n:L.n,level:lists.length});walk(c,ns);cur=null;continue;
        }
        if(/^(DIV|P|H1|H2|H3|BLOCKQUOTE)$/.test(tg)){
          var sa=align;align=c.style&&c.style.textAlign?c.style.textAlign:align;
          cur=null;
          if(/^H/.test(tg)){newPara({head:true})}
          walk(c,ns);cur=null;align=sa;continue;
        }
        walk(c,ns);
      }
    }
  }
  walk(root,ST(12));

}

/* ---------- tables ---------- */
var DOTC={ok:'#2fbf71',warn:'#f0b429',chk:'#ef5350'};
function cellObj(c){return(c&&typeof c==='object')?c:{s:c==null?'':String(c)}}

  var head=b.head&&b.head.length?b.head:[''],ncol=head.length,hasSt=!!(b.status&&b.status.some(function(x){return x})),land=ncol>4;
  var PW=Math.round(mm(land?297:210)),PH=Math.round(mm(land?210:297)),mg=mm(12),W=PW-2*mg,bot=PH-mm(18);
  var pt=ncol>10?7.5:(ncol>7?8.5:10),pad=mm(1.6),LH=1.5;
  var stW=hasSt?mm(6.5):0,TW=W-stW;

    var o=cellObj(c);
    return ST(pt*(1+0.1*(o.sz||0)),{b:isH||!!o.b,i:!!o.i,c:normColor(o.c)||'#111111'});
  }
  var nat=[],mn=[],c,i;
  function measureCell(cell,isH,ci){
    var o=cellObj(cell),st=cstyle(cell,isH);
    o.s.split(/\r?\n/).forEach(function(par){
      nat[ci]=Math.max(nat[ci],mw(par,st));
      par.split(/ +/).forEach(function(w){if(w&&!/^https?:\/\//i.test(w))mn[ci]=Math.max(mn[ci],mw(w,st))});
    });
  }
  for(c=0;c<ncol;c++){nat[c]=0;mn[c]=0;measureCell(head[c],true,c)}

  var sn=0,sm=0,minChars=mw('WWWW',ST(pt));
  for(c=0;c<ncol;c++){
    nat[c]=Math.min(nat[c],0.6*TW)+2*pad;
    mn[c]=Math.min(Math.max(mn[c],minChars),0.28*TW)+2*pad;
    if(mn[c]>nat[c])nat[c]=mn[c];
    sn+=nat[c];sm+=mn[c];
  }
  var cw=[];
  if(sn<=TW){for(c=0;c<ncol;c++)cw[c]=nat[c]*TW/sn}
  else if(sm>=TW){for(c=0;c<ncol;c++)cw[c]=mn[c]*TW/sm}
  else{var k=(TW-sm)/(sn-sm);for(c=0;c<ncol;c++)cw[c]=mn[c]+(nat[c]-mn[c])*k}

  function cellLines(cell,w,isH){
    var o=cellObj(cell),st=cstyle(cell,isH),lines=[];
    o.s.split(/\r?\n/).forEach(function(par){
      wrapRuns(par?[{s:par,st:st}]:[],w-2*pad).forEach(function(l){lines.push(l)});
    });
    var h=0;lines.forEach(function(l){h+=Math.max(l.hpt||pt,pt)*SC*LH});

  }
  function rowH(cl){var h=0;cl.forEach(function(x){h=Math.max(h,x.h)});return h+2*pad}
  var p=doc.page(land),y=mg;
  function drawRow(pg,yy,cl,fill,isH,status){
    var h=rowH(cl),x=mg,cc;
    if(hasSt){
      pg.ops.push({t:'rect',x:x,y:yy,w:stW,h:h,fill:isH?'#cfcfcf':fill,stroke:'#8a8a8a',lw:1.2});
      if(status&&DOTC[status])pg.ops.push({t:'dot',x:x+stW/2,y:yy+Math.min(h/2,pad+pt*SC*0.6),r:mm(1.5),c:DOTC[status]});
      x+=stW;
    }
    for(cc=0;cc<ncol;cc++){
      pg.ops.push({t:'rect',x:x,y:yy,w:cw[cc],h:h,fill:cl[cc].bg||fill,stroke:'#8a8a8a',lw:1.2});
      var ty=yy+pad;
      cl[cc].lines.forEach(function(l){
        var lh=Math.max(l.hpt||pt,pt)*SC*LH;
        putLine(pg,l,x+pad,ty,lh,isH?cw[cc]-2*pad:0,isH?'center':'left');ty+=lh;
      });
      x+=cw[cc];
    }
    return h;
  }
  if(b.title){
    var tf=ST(18,{b:true});
    wrapRuns([{s:b.title,st:tf}],W).forEach(function(l){var lh=l.hpt*SC*1.4;putLine(p,l,mg,y,lh,W,'center');y+=lh});
  }
  if(b.sub){
    var sf=ST(11.5,{c:'#444444'});
    wrapRuns([{s:b.sub,st:sf}],W).forEach(function(l){var lh=l.hpt*SC*1.5;putLine(p,l,mg,y,lh,W,'center');y+=lh});
  }
  if(b.title||b.sub)y+=mm(4);
  var hl=head.map(function(h,cc){return cellLines(h,cw[cc],true)}),hH=rowH(hl);
  y+=drawRow(p,y,hl,'#cfcfcf',true,null);
  function newPage(){p=doc.page(land);y=mg;y+=drawRow(p,y,hl,'#cfcfcf',true,null)}
  var fullH=bot-mg-hH;
  b.rows.forEach(function(row,ri){
    var cl=[],cc;
    for(cc=0;cc<ncol;cc++)cl.push(cellLines(row[cc],cw[cc],false));
    var h=rowH(cl),fill=(ri%2)?'#f1f1f1':'#ffffff',stt=b.status?b.status[ri]:null;
    if(y+h<=bot){y+=drawRow(p,y,cl,fill,false,stt);return}
    if(h<=fullH){newPage();y+=drawRow(p,y,cl,fill,false,stt);return}
    /* a row taller than a whole page continues on the next page */
    var rem=cl.map(function(x){return {lines:x.lines.slice(),bg:x.bg}});
    while(rem.some(function(x){return x.lines.length})){

  out.push(c.join(' ')+' rg');

  function Tm(px,py){return '1 0 '+shear+' 1 '+px.toFixed(2)+' '+py.toFixed(2)+' Tm'}

    arr=[];
  }
  for(i=0;i<sh.gids.length;i++){
    var gid=sh.gids[i];

    }else if(o.t==='line'){

        (cx-q).toFixed(2)+' '+(cy+r).toFixed(2)+' '+(cx-r).toFixed(2)+' '+(cy+q).toFixed(2)+' '+(cx-r).toFixed(2)+' '+cy.toFixed(2)+' c '+
        (cx-r).toFixed(2)+' '+(cy-q).toFixed(2)+' '+(cx-q).toFixed(2)+' '+(cy-r).toFixed(2)+' '+cx.toFixed(2)+' '+(cy-r).toFixed(2)+' c '+
        (cx+q).toFixed(2)+' '+(cy-r).toFixed(2)+' '+(cx+r).toFixed(2)+' '+(cy-q).toFixed(2)+' '+(cx+r).toFixed(2)+' '+cy.toFixed(2)+' c f');
    }else if(o.t==='text'){

async function writeFont(w,F,tag){

async function buildVecPdf(doc,title,prog){
  var N=doc.pages.length,w=new PdfW(),i;
  w.put('%PDF-1.4\n');w.put(new Uint8Array([37,226,227,207,211,10]));
  var rootN=w.reserve(),pagesN=w.reserve(),kids=[],pend=[];
  var foot=ST(9,{});
  for(i=0;i<N;i++){
    var p=doc.pages[i],Hpt=p.h/SC,Wpt=p.w/SC;
    var label=t('Page')+' '+(i+1)+' '+t('of')+' '+N,fw=mw(label,foot);
    p.ops.push({t:'text',s:label,x:(p.w-fw)/2,y:p.h-mm(9),st:foot,c:'#777777'});
    var imgs=[],cs=pageContent(p,Hpt,imgs);
    pend.push({p:p,Hpt:Hpt,Wpt:Wpt,cs:cs,imgs:imgs});
    if(i%20===0)prog(i+1,N);
  }
  var fontNs={};
  /* fonts are written once, after every page has been measured, so only the glyphs used are listed */
  var cNs=[],pageObjs=[];
  for(i=0;i<N;i++){
    var q=pend[i],pN=w.reserve(),cN=w.reserve(),imN=[],an=[];
    await streamObj(w,cN,'',w.enc.encode(q.cs));
    for(var j=0;j<q.imgs.length;j++){
      var iN=w.reserve();imN.push(iN);
      w.stream(iN,'/Type /XObject /Subtype /Image /Width '+q.imgs[j].iw+' /Height '+q.imgs[j].ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode',q.imgs[j].jpg,false);
    }
    q.p.links.forEach(function(l){
      var a=w.reserve(),r=linkRect(q.p,l);an.push(a);
      w.obj(a,'<< /Type /Annot /Subtype /Link /Rect ['+r.join(' ')+'] /Border [0 0 0] /A << /S /URI /URI ('+pstr(l.u)+') >> >>');
    });
    pageObjs.push({pN:pN,cN:cN,imN:imN,an:an,q:q});
    kids.push(pN);
  }
  var regN=await writeFont(w,PF.reg,'R'),boldN=PF.bold===PF.reg?regN:await writeFont(w,PF.bold,'B');
  pageObjs.forEach(function(o){
    var xo=o.imN.map(function(n,k){return '/Im'+(k+1)+' '+n+' 0 R'}).join(' ');
    w.obj(o.pN,'<< /Type /Page /Parent '+pagesN+' 0 R /MediaBox [0 0 '+o.q.Wpt.toFixed(2)+' '+o.q.Hpt.toFixed(2)+'] /Resources << /Font << /F1 '+regN+' 0 R /F2 '+boldN+' 0 R >> /XObject << '+xo+' >> >> /Contents '+o.cN+' 0 R'+(o.an.length?' /Annots ['+o.an.map(function(a){return a+' 0 R'}).join(' ')+']':'')+' >>');
  });
  w.obj(pagesN,'<< /Type /Pages /Kids ['+kids.map(function(k){return k+' 0 R'}).join(' ')+'] /Count '+kids.length+' >>');
  var infoN=w.reserve();w.obj(infoN,'<< /Title '+hex16(title||'')+' /Producer (Research Sangrah) >>');
  w.obj(rootN,'<< /Type /Catalog /Pages '+pagesN+' 0 R >>');
  return w.finish(rootN,infoN);
}
async function layoutAll(blocks){
  var doc=new Doc(),i;
  for(i=0;i<blocks.length;i++){
    var b=blocks[i];
    if(b.type==='rich')layoutRichBlock(doc,b);
    else if(b.type==='table')layoutTableBlock(doc,b);

  }

}
async function buildPdf(blocks,title,prog){
