/* ---------- what goes into the PDF ---------- */
function editsOf(m,name){return(m.edits&&m.edits[name])||{cells:{},addRows:0,addCols:0,st:{}}}
function sheetModel(ws,ed){
  if(!ws||!ws['!ref'])return null;
  var r=XLSX.utils.decode_range(ws['!ref']);
  function cell(R,C){return ws[XLSX.utils.encode_cell({r:R,c:C})]}
  var R,C,j,hdr=r.s.r,lim=Math.min(r.e.r,r.s.r+15),st=ed.st||{};
  for(R=r.s.r;R<=lim;R++){var n=0;for(C=r.s.c;C<=r.e.c;C++)if(nonEmpty(cell(R,C)))n++;if(n>=2){hdr=R;break}}
  var title='';
  for(R=r.s.r;R<hdr&&!title;R++){for(C=r.s.c;C<=r.e.c;C++){if(nonEmpty(cell(R,C))){title=cellText(cell(R,C));break}}}
  var wr={};
  for(C=r.s.c;C<=r.e.c;C++){
    if(!nonEmpty(cell(hdr,C))||r.e.r<=hdr)continue;
    var all=true;
    for(R=hdr+1;R<=r.e.r;R++){if(nonEmpty(cell(R,C))){all=false;break}}
    if(all)wr[C]=1;
  }
  var hid=ws['!rows']||[],maxR=Math.min(r.e.r,hdr+4999),head=[],rows=[],status=[],row;
  for(C=r.s.c;C<=r.e.c;C++)head.push(cellText(cell(hdr,C)));
  for(j=0;j<ed.addCols;j++)head.push(ed.cells[hdr+','+(r.e.c+1+j)]||'');
  for(R=hdr+1;R<=maxR;R++){
    if(hid[R]&&hid[R].hidden)continue;
    row=[];
    for(C=r.s.c;C<=r.e.c;C++)row.push(wr[C]?(ed.cells[R+','+C]||''):cellText(cell(R,C)));
    for(j=0;j<ed.addCols;j++)row.push(ed.cells[R+','+(r.e.c+1+j)]||'');
    rows.push(row);status.push(st[R]||'');
  }
  for(var a=0;a<ed.addRows;a++){
    R=r.e.r+1+a;row=[];
    for(C=r.s.c;C<=r.e.c+ed.addCols;C++)row.push(ed.cells[R+','+C]||'');
    rows.push(row);status.push(st[R]||'');
  }
  return {title:title,head:head,rows:rows,status:status};
}
function gridBlock(m){
  var g=ensureGrid(m);
  var rows=g.rows.map(function(row,r){
    return row.map(function(v,c){
      var f=g.fmt[g.rid[r]+'|'+g.cid[c]];
      return f?{s:v,b:f.b,i:f.i,c:f.c,bg:f.bg,sz:f.sz}:v;
    });
  });
  return {type:'table',title:m.name==='Untitled table'?'':m.name,sub:g.sub,head:g.head,rows:rows,status:g.rid.map(function(id){return g.st[id]||''})};
}
function noteBlock(m){
  var paras=m.html?htmlToParas(m.html):plainToParas(m.text||'');
  return {type:'rich',title:m.name==='Untitled note'?'':m.name,paras:paras};
}

/* ---------- PDF with the user's marks (pdf-lib) ---------- */
async function textPng(s,sizePx,color){
  var scale=3,cv=document.createElement('canvas'),cx=cv.getContext('2d'),f=(sizePx*scale)+'px "Noto Sans Devanagari",system-ui,sans-serif';
  cx.font=f;
  var lines=s.split('\n'),w=0;
  lines.forEach(function(l){w=Math.max(w,cx.measureText(l).width)});
  var lh=sizePx*scale*1.25;
  cv.width=Math.max(2,Math.ceil(w+4));cv.height=Math.max(2,Math.ceil(lh*lines.length+4));
  cx.font=f;cx.fillStyle=color;cx.textBaseline='top';
  lines.forEach(function(l,i){cx.fillText(l,2,2+i*lh)});
  var blob=await new Promise(function(r){cv.toBlob(r,'image/png')});
  return {bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width/scale,h:cv.height/scale};
}
async function annotatePdfBytes(buf,ann){
  var PL=window.PDFLib,doc=await PL.PDFDocument.load(buf,{ignoreEncryption:true}),pages=doc.getPages();
  for(var key in ann){
    var list=ann[key],page=pages[+key];
    if(!page||!list||!list.length)continue;
    var sz=page.getSize(),W=sz.width,H=sz.height,rot=((page.getRotation().angle%360)+360)%360;
    var dw=(rot%180)?H:W,dh=(rot%180)?W:H;
    var map=function(u,v){
      if(rot===90)return [v*W,u*H];
      if(rot===180)return [(1-u)*W,v*H];
      if(rot===270)return [(1-v)*W,(1-u)*H];
      return [u*W,(1-v)*H];
    };
    for(var i=0;i<list.length;i++){
      var a=list[i],c=rgbOf(a.c),col=PL.rgb(c[0],c[1],c[2]);
      if(a.t==='h'){
        var p1=map(a.x,a.y),p2=map(a.x+a.w,a.y+a.h);
        page.drawRectangle({x:Math.min(p1[0],p2[0]),y:Math.min(p1[1],p2[1]),width:Math.abs(p2[0]-p1[0]),height:Math.abs(p2[1]-p1[1]),color:col,opacity:0.38});
      }else if(a.t==='p'){
        for(var j=0;j<a.pts.length-1;j++){
          var s=map(a.pts[j][0],a.pts[j][1]),e=map(a.pts[j+1][0],a.pts[j+1][1]);
          page.drawLine({start:{x:s[0],y:s[1]},end:{x:e[0],y:e[1]},thickness:a.w*dw,color:col,lineCap:PL.LineCapStyle.Round});
        }
      }else if(a.t==='t'){
        var img=await textPng(a.s,a.sz*dw,a.c),emb=await doc.embedPng(img.bytes);
        var hn=img.h/dh,anc=map(a.x,a.y+hn);
        page.drawImage(emb,{x:anc[0],y:anc[1],width:img.w,height:img.h,rotate:PL.degrees(rot)});
      }
    }
  }
  return await doc.save();
}

var MARKS={ok:'✔',warn:'!',chk:'?'};
function sheetName(s,i,used){

  var base=s,n=2;

function modelsOf(m,buf,onlyTab){

        Object.keys(ws).forEach(function(a){
          if(a[0]==='!')return;var c=ws[a];if(!c)return;
          if(c.l&&c.l.Target&&/^https?:/i.test(c.l.Target))add(c.l.Target,'');
          addText(cellText(c),'');
        });
        Object.keys(ed.cells||{}).forEach(function(x){addText(ed.cells[x],'')});
      });
    }else if(k==='pdf'&&window.pdfjsLib){
      var doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,np=Math.min(doc.numPages,300);
      for(var p=1;p<=np;p++){
        var pg=await doc.getPage(p),an=await pg.getAnnotations();
        an.forEach(function(a){if(a.url)add(a.url,'')});
      }
      try{doc.destroy()}catch(e){}
    }
  }
  return out;
}
async function showLinks(id){
  await loadItems();
  var m=(cur&&cur.id===id)?cur:byId(id);if(!m)return;
  setBusy(t('Collecting links…'));
  var groups=[];
  try{
    if(kindM(m)==='folder'){
      var kids=live().filter(function(x){return effParent(x)===id&&kindM(x)!=='folder'}).sort(sortFn);
      for(var i=0;i<kids.length;i++){
        var l=await collectLinks(kids[i]);
        if(l.length)groups.push({name:kids[i].name,links:l});
      }
    }else{
      var l2=await collectLinks(m);
      if(l2.length)groups.push({name:m.name,links:l2});
    }
  }catch(e){setBusy(null);toast(t('Could not read links')+': '+(e&&e.message||e));return}
  setBusy(null);
  var total=0;groups.forEach(function(g){total+=g.links.length});
  if(!total){toast(t('No links found'));return}
  var many=groups.length>1,n=0,plain=[],named=[];
  groups.forEach(function(g){
    if(many){plain.push('== '+g.name+' ==');named.push('== '+g.name+' ==')}
    g.links.forEach(function(x){
      n++;plain.push(n+'. '+x.url);named.push(n+'. '+(x.label?x.label+' — ':'')+x.url);
    });
    if(many){plain.push('');named.push('')}
  });
  var tp=plain.join('\n').trim(),tn=named.join('\n').trim();
  var r=await new Promise(function(res){
    if(modalRes)closeModal(null);
    modalRes=res;
    openModal('<h2>'+t('Links')+' ('+total+')</h2><textarea readonly id="lk">'+esc(tp)+'</textarea><div class="mrow"><button class="mbtn" data-k="__x">'+t('Close')+'</button><button class="mbtn" data-k="names">'+t('Copy with names')+'</button><button class="mbtn pri" data-k="copy">'+t('Copy links')+'</button></div>');
  });
  if(r==='copy'||r==='names'){
    var ok=await copyText(r==='copy'?tp:tn);
    toast(ok?t('Copied'):t('Could not copy'));
  }
}

/* ---------- Share into the app (from Chrome, WhatsApp, ...) ---------- */
var lastShared='';
async function handleShared(r){
  var parts=[r.title,r.description,r.text,r.url].filter(function(x){return typeof x==='string'&&x.trim()&&!/^(content|file):/i.test(x)});
  var txt=parts.join('\n').trim();
  if(!txt||txt===lastShared)return;
  lastShared=txt;
  var urls=urlsIn(txt),link=urls[0]||'',stmt=txt;
  urls.forEach(function(u){stmt=stmt.split(u).join(' ')});
  stmt=stmt.replace(/\s+/g,' ').trim()||link;
  if(busy||modalOpen)return;
  var a=await askSheet(t('Save what you shared'),[
    {k:'row',label:t('Add as a row in a table'),sub:stmt.slice(0,90)},
    {k:'note',label:t('Save as a note')}]);
  if(!a)return;
  if(a==='row'){
    var target=await chooseTable(null,t('Add to which table?'));
    if(!target)return;
    var ri=addRowToGrid(target,{statement:stmt,link:link});
    await putMeta(target);
    if(cur&&cur.id===target.id){await goHome()}
    toast(t('Added to')+' '+target.name+' ('+t('row')+' '+(ri+1)+')');
  }else{
    var p=await pickFolder(null);if(p===undefined)return;
    var nt=await createNote({name:(stmt||link).slice(0,40),text:txt,parent:p,silent:true});
    toast(t('Note saved'));
  }
  if($('#viewer').classList.contains('hidden'))renderList();
}
function initShare(){
  var SI=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SendIntent;
  if(!SI||!SI.checkSendIntentReceived)return;
  function check(){
    SI.checkSendIntentReceived().then(function(r){if(r&&(r.title||r.description||r.url||r.text))handleShared(r)}).catch(function(){});
  }
  window.addEventListener('sendIntentReceived',check);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
  setTimeout(check,600);
}

/* ---------- start ---------- */
applySet();
$('#ver').textContent=VERSION;
purgeOld().catch(function(){}).then(function(){renderList()});
initShare();

})();
