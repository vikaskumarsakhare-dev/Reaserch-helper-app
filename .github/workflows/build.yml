name: APK बनाओ

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: पैकेज इंस्टॉल
        run: npm install

      - name: लाइब्रेरी ऐप में रखना
        run: |
          mkdir -p www/lib
          cp node_modules/xlsx/dist/xlsx.full.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/mammoth/mammoth.browser.min.js www/lib/

      - name: एंड्रॉयड प्रोजेक्ट बनाना
        run: |
          npx cap add android
          npx cap sync android

      - name: हिंदी नाम लगाना
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">शोध संग्रह</string>|' $F
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">शोध संग्रह</string>|' $F

      - name: एक ही साइनिंग कुंजी रखना (ताकि नया वर्शन पुराने के ऊपर लगे)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: APK बनाना
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK सेव करना
        uses: actions/upload-artifact@v4
        with:
          name: shodh-sangrah-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: डाउनलोड लिंक बनाना (Releases में)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: शोध संग्रह बिल्ड ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
