name: Build APK v1.4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: npm install

      - name: Copy libraries into the app
        run: |
          mkdir -p www/lib
          cp node_modules/xlsx/dist/xlsx.full.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/mammoth/mammoth.browser.min.js www/lib/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App name and logo
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">रिसर्च संग्रह</string>|' $F
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">रिसर्च संग्रह</string>|' $F
          pip install pillow
          python tools/make_icon.py android/app/src/main/res

      - name: Keep the same signing key (so updates install over the old app)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: research-sangrah-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Research Sangrah build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
